name: R02 Extract Legacy Engine Source

on:
  push:
    branches:
      - agent/upstream-refactor
    paths:
      - .github/workflows/r02-extract-engine.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: agent/upstream-refactor
          fetch-depth: 0

      - name: Fetch legacy reference branch
        run: git fetch origin agent/native-shader-lab:refs/remotes/origin/agent/native-shader-lab

      - name: Reconstruct and normalize v6.1.1 source
        shell: bash
        run: |
          set -euo pipefail
          legacy='origin/agent/native-shader-lab'
          payload='app/src/main/assets/mpvlab/payload/workstation.b64'
          archive=/tmp/mpvlab-workstation.zip
          encoded=/tmp/mpvlab-workstation.b64
          : > "$encoded"

          for part in 00 01 02 03 04 05 06 07; do
            git show "$legacy:$payload.$part" | tr -d '[:space:]' >> "$encoded"
          done

          base64 --decode "$encoded" > "$archive"
          echo 'e498dfebbec204b264fb00bf5a39f9df70ecec6f87bc34fdc224cfc14653dcc6  /tmp/mpvlab-workstation.zip' | sha256sum --check --strict

          rm -rf app/src/main/assets/mpvlab/source
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path
          import shutil
          import zipfile

          archive = Path('/tmp/mpvlab-workstation.zip')
          unpacked = Path('/tmp/mpvlab-unpacked')
          root = Path('app/src/main/assets/mpvlab/source')
          if unpacked.exists():
              shutil.rmtree(unpacked)
          unpacked.mkdir(parents=True)
          root.mkdir(parents=True, exist_ok=True)

          with zipfile.ZipFile(archive) as zf:
              for info in zf.infolist():
                  target = (unpacked / info.filename).resolve()
                  if unpacked.resolve() not in target.parents and target != unpacked.resolve():
                      raise RuntimeError(f'unsafe archive path: {info.filename}')
              zf.extractall(unpacked)

          copied: list[Path] = []
          for src in sorted(unpacked.rglob('*')):
              if not src.is_file():
                  continue
              rel = src.relative_to(unpacked)
              rel_posix = rel.as_posix()
              if rel_posix == 'README.txt':
                  dest = root / 'docs' / 'README.legacy-v6.1.1.txt'
              elif rel_posix in {'mpv.conf', 'input.conf'}:
                  dest = root / 'config' / rel.name
              elif rel.parts[0] in {'scripts', 'shaders'}:
                  dest = root / rel
              else:
                  dest = root / 'misc' / rel
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dest)
              copied.append(dest)

          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          config = root / 'config' / 'mpv.conf'
          options: list[str] = []
          if config.is_file():
              for raw in config.read_text(encoding='utf-8').splitlines():
                  line = raw.strip()
                  if line and not line.startswith('#'):
                      options.append(line)

          file_entries = [
              {
                  'path': path.relative_to(root).as_posix(),
                  'sha256': digest(path),
                  'bytes': path.stat().st_size,
              }
              for path in sorted(copied)
          ]

          scripts = [entry['path'] for entry in file_entries if entry['path'].startswith('scripts/')]
          shaders = [entry['path'] for entry in file_entries if entry['path'].startswith('shaders/')]

          manifest = {
              'engineVersion': '6.1.1-source-normalized-1',
              'schemaVersion': 1,
              'controlCatalogVersion': 'legacy-v6.1.1',
              'canonicalWorkspace': '/storage/emulated/0/mpv',
              'sourceProvenance': {
                  'repository': 'mekromn/mpvFlux-OSD',
                  'branch': 'agent/native-shader-lab',
                  'payloadSha256': 'e498dfebbec204b264fb00bf5a39f9df70ecec6f87bc34fdc224cfc14653dcc6',
                  'payloadParts': 8,
                  'legacyRuntimeRevision': '6.1.1-native-bridge-4',
                  'normalization': 'Original workstation archive extracted before ShaderLabRuntime private-directory/native-bridge patching.',
              },
              'entrypoints': {
                  'controller': 'scripts/pixel9-shader-lab.lua' if 'scripts/pixel9-shader-lab.lua' in scripts else None,
                  'touchDiagnostic': 'scripts/mpvflux-touch-diagnostic.lua' if 'scripts/mpvflux-touch-diagnostic.lua' in scripts else None,
                  'mpvConfig': 'config/mpv.conf',
                  'inputConfig': 'config/input.conf',
                  'shaderTemplate': next((p for p in shaders if 'template' in p), None),
              },
              'requiredMpvOptions': options,
              'files': file_entries,
          }
          (root / 'engine-manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )

          inventory = Path('docs/R02_SHADER_LAB_MIGRATION_INVENTORY.md')
          inventory_lines = [
              '# R02 Shader Lab v6.1.1 Migration Inventory',
              '',
              '## Purpose',
              '',
              'This inventory records the legacy Shader Lab implementation being normalized onto the latest-source refactor branch. R02 is source normalization only; these assets are **not wired into playback yet**.',
              '',
              '## Legacy Android wrapper files',
              '',
              '- `app/src/main/java/app/marlboroadvance/mpvex/ui/player/ShaderLabRuntime.kt` — reconstructed eight Base64 chunks into a ZIP, verified payload SHA-256, extracted to app-private storage, rewrote `/storage/emulated/0/mpv` paths to private storage, removed `script=`/`input-conf=` lines, and injected the native-state bridge into the Lua controller.',
              '- `app/src/main/java/app/marlboroadvance/mpvex/ui/player/ShaderLabBridge.kt` — Android control catalog plus semantic-ish `script-message` commands, preset/morph commands, and native-state parsing.',
              '- `app/src/main/java/app/marlboroadvance/mpvex/ui/player/ShaderLabStateBus.kt` — event-driven `StateFlow` copy of `user-data/p9lab/native-state`.',
              '- `app/src/main/assets/mpvlab/payload/workstation.b64.00` … `.07` — opaque Base64 representation of the legacy workstation ZIP; payload SHA-256 `e498dfebbec204b264fb00bf5a39f9df70ecec6f87bc34fdc224cfc14653dcc6`.',
              '',
              '## Normalization decision',
              '',
              '- The canonical R02 source is the **original v6.1.1 workstation archive before `ShaderLabRuntime` private-runtime patching**.',
              '- This intentionally keeps the workstation’s `/storage/emulated/0/mpv` assumptions because R03 will implement that path as the canonical Android workspace.',
              '- The legacy Kotlin-injected native-state publisher/apply scheduler is documented behavior, not silently injected into these files. Its useful semantics will be reimplemented cleanly in the typed command/state architecture in later roadmap steps.',
              '- The legacy branch remains unchanged and is the behavioral reference if an exact implementation detail needs to be recovered.',
              '',
              '## Extracted normalized files',
              '',
          ]
          inventory_lines.extend(f'- `{entry["path"]}` — `{entry["sha256"]}`' for entry in file_entries)
          inventory_lines += [
              '',
              '## Legacy behavior that must survive later refactors',
              '',
              '- Pixel 9 SDR/HDR guard and `vo=gpu` expanded-brightness workflow.',
              '- Live shader and MPV-property tuning.',
              '- Atomic/double-slot shader application and last-known-good behavior.',
              '- Bypass and press-to-preview-original.',
              '- Video-start revert, reset, save/load state.',
              '- Ten user presets, built-in presets, and preset morphing.',
              '- Gamut/luma clipping diagnostics and shader-reload proof mode.',
              '- Fine/normal/coarse step modes and grouped controls.',
              '- Event-driven native state (`user-data/p9lab/native-state`) rather than UI polling.',
              '',
              '## Explicitly not carried forward as architecture',
              '',
              '- Base64 workstation packaging.',
              '- App-private mpvLab workspace as the canonical user source of truth.',
              '- Runtime text surgery of the Lua controller.',
              '- Monolithic Android bridge/control catalog.',
              '- Fixed-interval UI polling or global-gesture ownership of Shader Lab controls.',
              '',
              '## Integrity',
              '',
              '`app/src/main/assets/mpvlab/source/engine-manifest.json` records every normalized source file SHA-256 plus the legacy payload provenance. Run `python3 tools/verify_mpvlab_manifest.py` to verify the tree.',
              '',
          ]
          inventory.write_text('\n'.join(inventory_lines), encoding='utf-8')
          print(f'Normalized {len(file_entries)} legacy engine files')
          PY

          python3 tools/verify_mpvlab_manifest.py

      - name: Commit normalized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app/src/main/assets/mpvlab/source docs/R02_SHADER_LAB_MIGRATION_INVENTORY.md
          if git diff --cached --quiet; then
            echo 'No R02 extraction changes to commit.'
            exit 0
          fi
          git commit -m 'R02 extract readable Shader Lab v6.1.1 engine source'
          git push origin HEAD:agent/upstream-refactor
