name: R02 Finalize Refactor State

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/r02-finalize-refactor.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: agent/upstream-refactor
          fetch-depth: 0
          path: refactor

      - name: Checkout master for self-removal
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          path: master-tree

      - name: Finalize R02 tracking files
        shell: bash
        working-directory: refactor
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          roadmap_path = Path('docs/SHADER_LAB_REFACTOR_ROADMAP.md')
          text = roadmap_path.read_text(encoding='utf-8')
          text = text.replace('`CURRENT_STEP = R02`', '`CURRENT_STEP = R03`', 1)
          start = text.index('## R02 — Create a readable Shader Lab source tree and migration inventory')
          end = text.index('\n---\n\n## R03 — Canonical `/storage/emulated/0/mpv` workspace manager', start)
          section = text[start:end]
          section = section.replace('**Status:** `TODO`', '**Status:** `DONE`', 1)
          section = section.replace('**Work:**', '**Completed work:**', 1)
          old_validation = '**Validation:** repository build still succeeds; asset manifest test/check passes if added.'
          new_validation = '''**Validation:** **PASS**. The legacy workstation payload matched SHA-256 `e498dfebbec204b264fb00bf5a39f9df70ecec6f87bc34fdc224cfc14653dcc6`, and `python3 tools/verify_mpvlab_manifest.py` passed before extraction commit `ff9e808770120075838379ff16f07bdb31865c11`. A normal development build passed on commit `516728c3e78d13f203246ae86a634c86d01639ed`: `Refactor Dev APK` run #23 / run ID `32387282949`, job `Signed phone-test APKs` / job ID `96484949926`, including compilation, APK signature verification, and both artifact uploads.

**Completion notes:**

- Added `app/src/main/assets/mpvlab/source/` with 11 readable v6.1.1 engine files covering config, Lua, shader template/runtime/known-good shader, diagnostics, and legacy documentation.
- Added `engine-manifest.json` with engine/schema/catalog versions, canonical workspace, legacy payload provenance, required mpv options, entrypoints, byte sizes, and SHA-256 for every normalized source file.
- Added `tools/verify_mpvlab_manifest.py` and `docs/R02_SHADER_LAB_MIGRATION_INVENTORY.md`.
- Canonical source is the original v6.1.1 archive before the legacy app-private path rewrite/native-state text injection, preserving `/storage/emulated/0/mpv` for R03.
- The eight Base64 workstation chunks remain only on the read-only legacy branch; the clean architecture no longer depends on them.
- Temporary R02 extraction/finalization workflows are removed after use.
- Validation artifacts: arm64 ID `9413531715` (`sha256:c2eee0ac7c77a3fd6f47ab870ccbd5d8c3f8cd806fb2789bec5beb9a0a54036c`) and universal ID `9413532666` (`sha256:c11828a729b0a59c0b4ee255079c35548c489bb871d409da828a74688c7a0664`).'''
          if old_validation not in section:
              raise RuntimeError('R02 validation marker not found')
          section = section.replace(old_validation, new_validation, 1)
          roadmap_path.write_text(text[:start] + section + text[end:], encoding='utf-8')

          progress_path = Path('docs/SHADER_LAB_REFACTOR_PROGRESS.md')
          progress = progress_path.read_text(encoding='utf-8')
          old_state = '''- `CURRENT_STEP = R02`
- `R01_STATUS = DONE`
- R01 acceptance criteria are satisfied. The next `Continue roadmap` executes R02 only.'''
          new_state = '''- `CURRENT_STEP = R03`
- `R01_STATUS = DONE`
- `R02_STATUS = DONE`
- R02 acceptance criteria are satisfied. The next `Continue roadmap` executes R03 only.'''
          if old_state not in progress:
              raise RuntimeError('R02 progress pointer marker not found')
          progress = progress.replace(old_state, new_state, 1)
          progress += '''

## R02 — Readable Shader Lab source tree and migration inventory

**Status:** `DONE`

### Implemented

- Confirmed immediate upstream remains `Muhammedahmed18/mpvFlux@f2ed015356a20bb7021e850acc599274a5f91450`; no newer upstream source needed integration.
- Inventoried legacy `ShaderLabRuntime.kt`, `ShaderLabBridge.kt`, `ShaderLabStateBus.kt`, eight Base64 workstation payload chunks, Lua controller, configs, shader template/runtime files, diagnostics, and legacy docs.
- Reconstructed the legacy workstation only after verifying payload SHA-256 `e498dfebbec204b264fb00bf5a39f9df70ecec6f87bc34fdc224cfc14653dcc6`.
- Normalized 11 readable files into `app/src/main/assets/mpvlab/source/` under `config/`, `scripts/`, `shaders/`, `docs/`, and `misc/`.
- Preserved original v6.1.1 `/storage/emulated/0/mpv` paths rather than the old Kotlin private-directory rewrite because R03 owns canonical workspace implementation.
- Added `engine-manifest.json` with engine version `6.1.1-source-normalized-1`, schema version `1`, catalog version `legacy-v6.1.1`, entrypoints, required mpv options, payload provenance, file sizes, and SHA-256 hashes.
- Added `tools/verify_mpvlab_manifest.py` and `docs/R02_SHADER_LAB_MIGRATION_INVENTORY.md`.
- Documented the old Kotlin native-state publisher/apply scheduler as behavior to reimplement cleanly later; it is not silently text-injected into normalized Lua.
- Removed temporary extraction tooling after use. The legacy branch itself was not modified.

### Relevant commits

- `62b2b721c14d9e73dfc79176ba66e56ab5b8f491` — manifest verification tool.
- `dd001cf022519cf4fe6e20a5310e6c76ba053fba` — one-shot extraction bootstrap.
- `ff9e808770120075838379ff16f07bdb31865c11` — extracted/normalized readable v6.1.1 engine source and migration inventory.
- `516728c3e78d13f203246ae86a634c86d01639ed` — removed temporary extraction workflow; clean validation target.

### Validation

- Legacy payload SHA-256 verification: **PASS**.
- Normalized manifest verification (`python3 tools/verify_mpvlab_manifest.py`): **PASS**.
- Human-readable Lua/GLSL/config source review: **PASS**.
- GitHub Actions build: **PASS** — `Refactor Dev APK` run #23 (`32387282949`), job `Signed phone-test APKs` (`96484949926`).
- Arm64 artifact ID `9413531715`, digest `sha256:c2eee0ac7c77a3fd6f47ab870ccbd5d8c3f8cd806fb2789bec5beb9a0a54036c`.
- Universal artifact ID `9413532666`, digest `sha256:c11828a729b0a59c0b4ee255079c35548c489bb871d409da828a74688c7a0664`.

R02 is complete. The next roadmap step is R03; do not wire the assets into playback before the workspace manager is implemented.
'''
          progress_path.write_text(progress, encoding='utf-8')
          PY

          rm -f -- .github/workflows/r02-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/SHADER_LAB_REFACTOR_ROADMAP.md docs/SHADER_LAB_REFACTOR_PROGRESS.md
          git add -u -- .github/workflows/r02-finalize.yml || true
          git commit -m 'R02 finalize readable engine source and advance roadmap'
          git push origin HEAD:agent/upstream-refactor

      - name: Remove temporary master finalizer
        shell: bash
        working-directory: master-tree
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/r02-finalize-refactor.yml
          git commit -m 'Remove temporary R02 finalizer'
          git push origin HEAD:master
