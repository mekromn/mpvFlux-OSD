name: R07 Preinit Script Apply

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/upstream-refactor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/upstream-refactor
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply guarded pre-init activation fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one guarded match, found {count}")
              p.write_text(text.replace(old, new, 1))

          bridge = 'app/src/main/java/app/marlboroadvance/mpvex/repository/shaderlab/bridge/MpvShaderLabBridge.kt'
          replace_once(
              bridge,
              '''  private var attached = false\n  private var lastEventError: String? = null\n\n  fun attach() {''',
              '''  private var attached = false\n  private var enginePrepared = false\n  private var lastEventError: String? = null\n\n  /**\n   * Called from BaseMPVView.initOptions(), after mpv_create and before\n   * mpv_initialize. Loading the controller through the script option here is\n   * deterministic on libmpv and avoids relying on runtime load-script support.\n   */\n  fun prepareForMpvInitialization(): String? =\n    synchronized(commandLock) {\n      runCatching {\n        syncProbe.stage("preinit_engine_prepare")\n        ensureEnginePrepared()\n        syncProbe.stage("preinit_script_option", CONTROLLER_PATH)\n        CONTROLLER_PATH\n      }.onFailure(::recordTransportFailure).getOrNull()\n    }\n\n  fun attach() {''',
          )
          replace_once(
              bridge,
              '''        syncProbe.stage("engine_prepare")\n        prepareEngine()\n        syncProbe.stage("engine_ready")''',
              '''        syncProbe.stage("engine_prepare")\n        ensureEnginePrepared()\n        syncProbe.stage("engine_ready")''',
          )
          replace_once(
              bridge,
              '''  private fun requestNativeStateHandshake(stage: String) {''',
              '''  private fun ensureEnginePrepared() {\n    if (enginePrepared) return\n    prepareEngine()\n    enginePrepared = true\n  }\n\n  private fun requestNativeStateHandshake(stage: String) {''',
          )
          replace_once(
              bridge,
              '''                "No native-state snapshot after bounded load-script handshake",''',
              '''                "No native-state snapshot after pre-init script option and bounded load-script fallback",''',
          )

          mpv_view = 'app/src/main/java/app/marlboroadvance/mpvex/ui/player/MPVView.kt'
          replace_once(
              mpv_view,
              '''  override fun initOptions() {\n    val profile = decoderPreferences.profile.get()''',
              '''  override fun initOptions() {\n    shaderLabBridge.prepareForMpvInitialization()?.let { controllerPath ->\n      MPVLib.setOptionString("script", controllerPath)\n    }\n\n    val profile = decoderPreferences.profile.get()''',
          )

          test = 'app/src/test/java/app/marlboroadvance/mpvex/repository/shaderlab/bridge/MpvShaderLabBridgeTest.kt'
          replace_once(
              test,
              '''class MpvShaderLabBridgeTest {\n  @Test\n  fun attachObservesNativeStateGammaAndAllLiveMpvPropertiesAndRequestsHandshake() {''',
              '''class MpvShaderLabBridgeTest {\n  @Test\n  fun preInitPreparationReturnsCanonicalScriptAndDoesNotReprepareOnAttach() {\n    var prepareCount = 0\n    val bridge =\n      MpvShaderLabBridge(\n        transport = FakeTransport(),\n        prepareEngine = { prepareCount += 1 },\n      )\n\n    assertEquals(MpvShaderLabBridge.CONTROLLER_PATH, bridge.prepareForMpvInitialization())\n    assertEquals(1, prepareCount)\n\n    bridge.attach()\n\n    assertEquals(1, prepareCount)\n  }\n\n  @Test\n  fun preInitPreparationFailureReturnsNullAndSurfacesObservableError() {\n    val bridge =\n      MpvShaderLabBridge(\n        transport = FakeTransport(),\n        prepareEngine = { error("synthetic preinit failure") },\n      )\n\n    assertEquals(null, bridge.prepareForMpvInitialization())\n    assertEquals("synthetic preinit failure", bridge.state.value.lastError)\n  }\n\n  @Test\n  fun attachObservesNativeStateGammaAndAllLiveMpvPropertiesAndRequestsHandshake() {''',
          )

          # Ensure the lifecycle wiring is present exactly where intended.
          view_text = Path(mpv_view).read_text()
          assert 'override fun initOptions()' in view_text
          assert 'MPVLib.setOptionString("script", controllerPath)' in view_text
          assert view_text.index('MPVLib.setOptionString("script", controllerPath)') < view_text.index('val profile = decoderPreferences.profile.get()')

          # Remove temporary diagnosis/apply machinery from the verified source commit.
          for path in [
              '.github/workflows/r07-preinit-script-apply.yml',
              '.github/workflows/r07-lua-startup-diagnose.yml',
              '.github/R07_LUA_STARTUP_DIAG_TRIGGER',
              '.github/R07_PREINIT_APPLY_TRIGGER',
          ]:
              Path(path).unlink(missing_ok=True)
          PY
      - name: Validate repaired R07 tree
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testStandardDebugUnitTest --stacktrace
          git diff --check
      - name: Commit verified pre-init activation fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "R07 load Shader Lab controller before mpv initialization"
          git push origin HEAD:agent/upstream-refactor
