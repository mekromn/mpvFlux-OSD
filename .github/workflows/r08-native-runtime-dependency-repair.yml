name: R08 Native Runtime Dependency Repair

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r08-native-runtime-dependency-repair
  cancel-in-progress: true

jobs:
  repair-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "base_version_code=$(( $(date +%s) / 10 ))" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y pkg-config ninja-build python3-pip zip unzip binutils wget
          python3 -m pip install --user --upgrade 'meson>=1.6.1'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned native harness and exact libxml2 source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/Secozzi/mpv-android.git native/mpv-android
          git -C native/mpv-android checkout fd17fb02cfb8c8b5c12621c2c90769685d635d91
          cd native/mpv-android/buildscripts
          ./include/download-sdk.sh
          mkdir -p deps/libxml2
          wget -qO- https://gitlab.gnome.org/GNOME/libxml2/-/archive/v2.15.2/libxml2-v2.15.2.tar.gz \
            | tar -xz -C deps/libxml2 --strip-components=1

          python3 - <<'PY'
          from pathlib import Path
          path = Path('buildall.sh')
          text = path.read_text()
          old = 'export LDFLAGS="-Wl,-O1,--icf=safe -Wl,-z,max-page-size=16384"'
          new = 'export LDFLAGS="-Wl,-O1,--icf=safe -Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384"'
          assert text.count(old) == 1, text.count(old)
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Build matching arm64 libxml2
        shell: bash
        run: |
          set -euo pipefail
          cd native/mpv-android/buildscripts
          ./buildall.sh --arch arm64 libxml2
          test -f prefix/arm64/lib/libxml2.so
          readelf -dW prefix/arm64/lib/libxml2.so | tee /tmp/r08-libxml2-dynamic.txt
          readelf -lW prefix/arm64/lib/libxml2.so | tee /tmp/r08-libxml2-program-headers.txt
          python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/r08-libxml2-program-headers.txt').read_text()
          loads = [line for line in text.splitlines() if line.lstrip().startswith('LOAD')]
          assert loads, 'libxml2.so has no LOAD segments'
          bad = [line for line in loads if int(line.split()[-1], 16) < 0x4000]
          assert not bad, 'libxml2.so LOAD segments below 16 KB alignment:\n' + '\n'.join(bad)
          print('libxml2.so 16 KB alignment PASS')
          PY

      - name: Repair AAR and verify complete native dependency closure
        shell: bash
        run: |
          set -euo pipefail
          BASE_AAR=app/libs/mpv-android-lib-v0.0.1.aar
          rm -rf native/repaired-aar
          mkdir -p native/repaired-aar
          unzip -q "$BASE_AAR" -d native/repaired-aar
          test -f native/repaired-aar/jni/arm64-v8a/libmpv.so
          readelf -dW native/repaired-aar/jni/arm64-v8a/libmpv.so | grep -F 'Shared library: [libxml2.so]'

          cp native/mpv-android/buildscripts/prefix/arm64/lib/libxml2.so \
            native/repaired-aar/jni/arm64-v8a/libxml2.so

          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          root = Path('native/repaired-aar/jni/arm64-v8a')
          local = {p.name for p in root.glob('*.so')}
          system = {
              'libc.so', 'libm.so', 'libdl.so', 'liblog.so', 'libandroid.so',
              'libz.so', 'libEGL.so', 'libGLESv2.so', 'libGLESv3.so',
              'libOpenSLES.so', 'libmediandk.so', 'libvulkan.so', 'libaaudio.so',
              'libjnigraphics.so', 'libnativewindow.so',
          }
          missing = []
          report = []
          for so in sorted(root.glob('*.so')):
              dynamic = subprocess.check_output(['readelf', '-dW', str(so)], text=True)
              needed = re.findall(r'Shared library: \[([^]]+)\]', dynamic)
              report.append(f"{so.name}: {', '.join(needed) if needed else '<none>'}")
              for dep in needed:
                  if dep not in local and dep not in system:
                      missing.append(f'{so.name} -> {dep}')

              program = subprocess.check_output(['readelf', '-lW', str(so)], text=True)
              loads = [line for line in program.splitlines() if line.lstrip().startswith('LOAD')]
              assert loads, f'{so.name}: no LOAD segments'
              minimum = min(int(line.split()[-1], 16) for line in loads)
              assert minimum >= 0x4000, f'{so.name}: LOAD alignment 0x{minimum:x} < 0x4000'

          Path('/tmp/r08-aar-needed.txt').write_text('\n'.join(report) + '\n')
          print('\n'.join(report))
          assert not missing, 'unresolved packaged ELF dependencies: ' + ', '.join(missing)
          assert 'libxml2.so' in local, 'libxml2.so was not packaged'
          print('Final AAR native dependency closure PASS')
          PY

          rm -f native/mpv-android-lib-v0.0.1.repaired.aar
          (cd native/repaired-aar && zip -q -r ../mpv-android-lib-v0.0.1.repaired.aar .)
          cp native/mpv-android-lib-v0.0.1.repaired.aar "$BASE_AAR"

      - name: Run Shader Lab unit tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          python3 tools/verify_mpvlab_manifest.py
          ./gradlew :app:testStandardDebugUnitTest --stacktrace

      - name: Prepare persistent signing identity
        shell: bash
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_KEY_ALIAS_VALUE: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD_VALUE: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD_VALUE: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$SIGNING_KEYSTORE_B64" "$SIGNING_KEY_ALIAS_VALUE" "$SIGNING_STORE_PASSWORD_VALUE" "$SIGNING_KEY_PASSWORD_VALUE"; do
            [[ -n "$value" ]] || { echo '::error::Persistent signing secret missing'; exit 1; }
          done
          keystore="$RUNNER_TEMP/chrovelo-persistent.keystore"
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "CHROVELO_SIGNING_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
          echo "CHROVELO_SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS_VALUE" >> "$GITHUB_ENV"
          echo "CHROVELO_SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD_VALUE" >> "$GITHUB_ENV"
          echo "CHROVELO_SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD_VALUE" >> "$GITHUB_ENV"

      - name: Build repaired arm64 Debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleStandardDebug \
            -PchroveloVersionCode=${{ steps.meta.outputs.base_version_code }} \
            --stacktrace
          mkdir -p output
          apk="$(find app/build/outputs/apk/standard/debug -maxdepth 1 -type f -name 'app-standard-arm64-v8a-debug.apk' -print -quit)"
          [[ -n "$apk" ]] || { echo '::error::arm64 Debug APK not found'; exit 1; }
          cp "$apk" "output/Chrovelo-R08-runtime-repair-${{ steps.meta.outputs.short_sha }}-arm64-v8a.apk"

      - name: Verify repaired APK native payload and signing
        shell: bash
        run: |
          set -euo pipefail
          apk="output/Chrovelo-R08-runtime-repair-${{ steps.meta.outputs.short_sha }}-arm64-v8a.apk"
          unzip -l "$apk" | grep -F 'lib/arm64-v8a/libxml2.so'
          rm -rf /tmp/r08-apk-native
          mkdir -p /tmp/r08-apk-native
          unzip -q "$apk" 'lib/arm64-v8a/*.so' -d /tmp/r08-apk-native
          readelf -dW /tmp/r08-apk-native/lib/arm64-v8a/libmpv.so | grep -F 'Shared library: [libxml2.so]'
          test -f /tmp/r08-apk-native/lib/arm64-v8a/libxml2.so

          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"
          sha256sum "$apk" | tee /tmp/r08-runtime-repair-apk.sha256

      - name: Upload repaired Pixel APK
        uses: actions/upload-artifact@v4
        with:
          name: Chrovelo-R08-runtime-repair-arm64-${{ steps.meta.outputs.short_sha }}
          path: output/Chrovelo-R08-runtime-repair-${{ steps.meta.outputs.short_sha }}-arm64-v8a.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Commit repaired AAR
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app/libs/mpv-android-lib-v0.0.1.aar
          if git diff --cached --quiet; then
            echo 'Repaired AAR already committed.'
            exit 0
          fi
          git commit -m 'R08 package required libxml2 runtime dependency'
          git push origin HEAD:agent/upstream-refactor
