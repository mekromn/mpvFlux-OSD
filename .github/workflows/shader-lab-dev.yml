name: Shader Lab Dev APK

on:
  workflow_dispatch:
  push:
    branches:
      - agent/native-shader-lab

permissions:
  contents: read

concurrency:
  group: shader-lab-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Shader Lab branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: adopt
          java-version: 17
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build signed Standard Debug APKs
        run: ./gradlew assembleStandardDebug

      - name: Collect phone builds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          DEBUG_DIR="app/build/outputs/apk/standard/debug"

          echo "Built files:"
          find "$DEBUG_DIR" -maxdepth 1 -type f -name '*.apk' -print

          ARM64_APK=$(find "$DEBUG_DIR" -maxdepth 1 -type f -name '*arm64-v8a*debug*.apk' | head -n 1)
          UNIVERSAL_APK=$(find "$DEBUG_DIR" -maxdepth 1 -type f -name '*universal*debug*.apk' | head -n 1)

          test -n "$ARM64_APK"
          cp "$ARM64_APK" output/MpvFlux-ShaderLab-dev-arm64-v8a.apk

          if [ -n "$UNIVERSAL_APK" ]; then
            cp "$UNIVERSAL_APK" output/MpvFlux-ShaderLab-dev-universal.apk
          fi

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Shader-Lab-Dev-APK
          path: output/*.apk
          if-no-files-found: error
          retention-days: 14
