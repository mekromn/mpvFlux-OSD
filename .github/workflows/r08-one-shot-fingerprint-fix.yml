name: R08 One-Shot Renderer Fingerprint Repair

on:
  push:
    branches:
      - agent/upstream-refactor
    paths:
      - .github/workflows/r08-one-shot-fingerprint-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize exact R07 Meson fingerprint ordering
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('tools/r08_renderer_parity_rebuild.sh')
          s = p.read_text()
          boundary = "p.write_text(s)\nPY\n\nr08_phase shaderc_topology"
          assert s.count(boundary) == 1, s.count(boundary)
          insert = r'''# Preserve the exact accepted R07 mpv configuration fingerprint. Newer
          # Meson normalizes --default-library to the front of the embedded option
          # string; spelling it as -Ddefault_library=shared at the end preserves
          # identical build semantics and the accepted R07 metadata ordering.
          old = '\t--default-library shared \\\n'
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, '', 1)
          old = '\t-Dmanpage-build=disabled\n'
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, '\t-Dmanpage-build=disabled -Ddefault_library=shared\n', 1)
          '''
          s = s.replace(boundary, insert + boundary, 1)
          p.write_text(s)
          PY

          grep -F -- "old = '\t--default-library shared" tools/r08_renderer_parity_rebuild.sh
          grep -F -- "-Dmanpage-build=disabled -Ddefault_library=shared" tools/r08_renderer_parity_rebuild.sh

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/r08_renderer_parity_rebuild.sh
          git diff --cached --check
          git commit -m 'R08 preserve exact mpv Meson fingerprint order'
          git push origin HEAD:agent/upstream-refactor
