name: R08 Custom libmpv Proof

on:
  push:
    branches:
      - agent/upstream-refactor
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r08-libmpv-proof-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build-arm64:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check R08 trigger
        id: trigger
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || -f .github/R08_LIBMPV_PROBE_TRIGGER ]]; then
            echo 'enabled=yes' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=no' >> "$GITHUB_OUTPUT"
          fi

      - name: Finalize R08 resident source compatibility
        if: steps.trigger.outputs.enabled == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/r08_finalize_resident.py
          grep -F 'p9lab-native-user-save-r08' app/src/main/assets/mpvlab/source/scripts/pixel9-shader-lab.lua
          grep -F 'p9lab-native-save-state-r08' app/src/main/assets/mpvlab/source/scripts/pixel9-shader-lab.lua
          grep -F 'luaStateSnapshot()' app/src/main/java/app/marlboroadvance/mpvex/repository/shaderlab/bridge/MpvShaderLabBridge.kt
          python3 tools/verify_mpvlab_manifest.py
          python3 - <<'PY'
          from pathlib import Path
          shader = Path('app/src/main/assets/mpvlab/source/shaders/pixel9-perceptual-expansion-resident-v3.1.glsl').read_text()
          assert '@@' not in shader, 'resident shader contains unresolved template token'
          assert shader.count('//!PARAM ') == 39, shader.count('//!PARAM ')
          print('Resident shader PARAM audit PASS: 39')
          PY

      - name: Install native build dependencies
        if: steps.trigger.outputs.enabled == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y autoconf automake libtool pkg-config ninja-build gperf python3-pip nasm yasm lua5.2 zip unzip binutils
          python3 -m pip install --user --upgrade 'meson>=1.6.1'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/meson" --version
          lua5.2 -e 'assert(loadfile("app/src/main/assets/mpvlab/source/scripts/pixel9-shader-lab.lua"))'

      - name: Fetch pinned native build harness
        if: steps.trigger.outputs.enabled == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/Secozzi/mpv-android.git native/mpv-android
          cd native/mpv-android
          git checkout fd17fb02cfb8c8b5c12621c2c90769685d635d91

      - name: Fetch dependencies and pin shipped FFmpeg plus proven renderer baseline
        if: steps.trigger.outputs.enabled == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          cd native/mpv-android/buildscripts
          ./download.sh

          cd deps/ffmpeg
          git config gc.auto 0
          git reset --hard HEAD
          git fetch --no-tags --depth=1 origin 5ba2525c7affc29cbd99e6266946b382d3fffe8b
          git checkout --detach 5ba2525c7affc29cbd99e6266946b382d3fffe8b
          git apply ../../patches/ffmpeg_force_mpegts.patch
          test "$(git rev-parse HEAD)" = '5ba2525c7affc29cbd99e6266946b382d3fffe8b'
          git diff --check
          git log -1 --format='%H %s' | tee /tmp/r08-ffmpeg-commit.txt

          cd ../mpv
          git config gc.auto 0
          git fetch --no-tags --depth=3 origin \
            d54bad5636924ab3f39cb6e397b94b6aa8a7c433 \
            91ceffce42534a45705617036b6b2a392a32fc57 \
            0d655fe66590009e1d77a17581257d677286531a
          git checkout --detach d54bad5636924ab3f39cb6e397b94b6aa8a7c433
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git cherry-pick 91ceffce42534a45705617036b6b2a392a32fc57
          git cherry-pick 0d655fe66590009e1d77a17581257d677286531a

      - name: Apply Chrovelo narrow native patches
        if: steps.trigger.outputs.enabled == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          cd native/mpv-android
          python3 - <<'PY'
          from pathlib import Path

          header = Path('buildscripts/deps/mpv/video/out/gpu/user_shaders.h')
          text = header.read_text()
          old = '#define SHADER_MAX_PARAMS 16'
          assert text.count(old) == 1, text.count(old)
          header.write_text(text.replace(old, '#define SHADER_MAX_PARAMS 64', 1))

          buildall = Path('buildscripts/buildall.sh')
          text = buildall.read_text()
          old = 'export LDFLAGS="-Wl,-O1,--icf=safe -Wl,-z,max-page-size=16384"'
          new = 'export LDFLAGS="-Wl,-O1,--icf=safe -Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384"'
          assert text.count(old) == 1, text.count(old)
          buildall.write_text(text.replace(old, new, 1))
          PY
          grep -F '#define SHADER_MAX_PARAMS 64' buildscripts/deps/mpv/video/out/gpu/user_shaders.h
          grep -F -- '-Wl,-z,common-page-size=16384' buildscripts/buildall.sh

      - name: Build arm64 custom libmpv
        if: steps.trigger.outputs.enabled == 'yes'
        shell: bash
        env:
          GRADLE_OPTS: -Xmx4G
        run: |
          set -euo pipefail
          cd native/mpv-android/buildscripts
          ./buildall.sh --arch arm64 mpv 2>&1 | tee /tmp/r08-native-build.log

      - name: Verify PARAM feature and custom libmpv alignment
        if: steps.trigger.outputs.enabled == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          test -f native/mpv-android/buildscripts/prefix/arm64/lib/libmpv.so
          grep -F '#define SHADER_MAX_PARAMS 64' native/mpv-android/buildscripts/deps/mpv/video/out/gpu/user_shaders.h
          git -C native/mpv-android/buildscripts/deps/mpv log -3 --format='%H %s' | tee /tmp/r08-mpv-commits.txt
          test "$(git -C native/mpv-android/buildscripts/deps/ffmpeg rev-parse HEAD)" = '5ba2525c7affc29cbd99e6266946b382d3fffe8b'
          readelf -lW native/mpv-android/buildscripts/prefix/arm64/lib/libmpv.so | tee /tmp/r08-libmpv-program-headers.txt
          python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/r08-libmpv-program-headers.txt').read_text()
          loads = [line for line in text.splitlines() if line.lstrip().startswith('LOAD')]
          assert loads, 'no LOAD segments found in custom libmpv'
          bad = [line for line in loads if int(line.split()[-1], 16) < 0x4000]
          assert not bad, 'custom libmpv LOAD segments below 16 KB alignment:\n' + '\n'.join(bad)
          print('Custom libmpv 16 KB ELF LOAD alignment PASS')
          PY

      - name: Preserve MPVLib wrapper and replace only ABI-matched libmpv
        if: steps.trigger.outputs.enabled == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          BASE_AAR=app/libs/mpv-android-lib-v0.0.1.aar
          test -f "$BASE_AAR"
          rm -rf native/base-aar
          mkdir -p native/base-aar
          unzip -q "$BASE_AAR" -d native/base-aar
          test -f native/base-aar/classes.jar
          test -f native/base-aar/jni/arm64-v8a/libmpv.so
          test -f native/base-aar/jni/arm64-v8a/libplayer.so
          test -f native/base-aar/jni/arm64-v8a/libavdevice.so

          jar tf native/base-aar/classes.jar | grep -Fx 'is/xyz/mpv/MPVLib.class'
          jar tf native/base-aar/classes.jar | grep -Fx 'is/xyz/mpv/MPVNode.class'

          strings native/base-aar/jni/arm64-v8a/libmpv.so | grep -F 'mpv v0.41.0-224-gd54bad563'
          strings native/base-aar/jni/arm64-v8a/libavdevice.so | grep -F 'FFmpeg version N-122998-g5ba2525c7a'
          sha256sum native/base-aar/classes.jar native/base-aar/jni/arm64-v8a/libplayer.so | tee /tmp/r08-wrapper-before.sha256

          cp native/mpv-android/buildscripts/prefix/arm64/lib/libmpv.so native/base-aar/jni/arm64-v8a/libmpv.so
          rm -f native/Chrovelo-R08-custom-libmpv-arm64.aar
          (cd native/base-aar && zip -q -r ../Chrovelo-R08-custom-libmpv-arm64.aar .)

          unzip -p native/Chrovelo-R08-custom-libmpv-arm64.aar classes.jar > /tmp/r08-classes.jar
          jar tf /tmp/r08-classes.jar | grep -Fx 'is/xyz/mpv/MPVLib.class'
          jar tf /tmp/r08-classes.jar | grep -Fx 'is/xyz/mpv/MPVNode.class'
          sha256sum native/base-aar/classes.jar native/base-aar/jni/arm64-v8a/libplayer.so | tee /tmp/r08-wrapper-after.sha256
          diff -u /tmp/r08-wrapper-before.sha256 /tmp/r08-wrapper-after.sha256

      - name: Verify every arm64 ELF in patched AAR is 16 KB compatible
        if: steps.trigger.outputs.enabled == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          root = Path('native/base-aar/jni/arm64-v8a')
          sos = sorted(root.glob('*.so'))
          assert sos, 'patched AAR contains no arm64 shared libraries'
          report = []
          bad = []
          for so in sos:
              text = subprocess.check_output(['readelf', '-lW', str(so)], text=True)
              loads = [line for line in text.splitlines() if line.lstrip().startswith('LOAD')]
              assert loads, f'{so}: no LOAD segments'
              minimum = min(int(line.split()[-1], 16) for line in loads)
              report.append(f'{so.name}: min LOAD align=0x{minimum:x}')
              if minimum < 0x4000:
                  bad.append(f'{so.name}: 0x{minimum:x}')
          Path('/tmp/r08-aar-elf-alignment.txt').write_text('\n'.join(report) + '\n')
          print('\n'.join(report))
          assert not bad, 'arm64 ELF files below 16 KB alignment: ' + ', '.join(bad)
          print('Patched AAR arm64 16 KB alignment PASS')
          PY

      - name: Compile and test Chrovelo against patched AAR
        if: steps.trigger.outputs.enabled == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          cp native/Chrovelo-R08-custom-libmpv-arm64.aar app/libs/mpv-android-lib-v0.0.1.aar
          chmod +x ./gradlew
          python3 tools/verify_mpvlab_manifest.py
          ./gradlew :app:testStandardDebugUnitTest :app:assembleStandardDebug --stacktrace 2>&1 | tee /tmp/r08-gradle.log

      - name: Collect failure diagnostics
        if: failure() && steps.trigger.outputs.enabled == 'yes'
        shell: bash
        run: |
          set +e
          mkdir -p r08-failure
          cp /tmp/r08-native-build.log r08-failure/native-build.log 2>/dev/null || true
          cp /tmp/r08-gradle.log r08-failure/gradle.log 2>/dev/null || true
          cp /tmp/r08-ffmpeg-commit.txt r08-failure/ffmpeg-commit.txt 2>/dev/null || true
          cp /tmp/r08-mpv-commits.txt r08-failure/mpv-commits.txt 2>/dev/null || true
          cp /tmp/r08-libmpv-program-headers.txt r08-failure/libmpv-program-headers.txt 2>/dev/null || true
          cp /tmp/r08-aar-elf-alignment.txt r08-failure/aar-elf-alignment.txt 2>/dev/null || true
          find native/mpv-android -type f -name 'meson-log.txt' -print | while read -r log; do
            dest="r08-failure/${log#native/mpv-android/}"
            mkdir -p "$(dirname "$dest")"
            cp "$log" "$dest"
          done

      - name: Upload failure diagnostics
        if: failure() && steps.trigger.outputs.enabled == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: Chrovelo-R08-failure-${{ github.sha }}
          path: r08-failure/
          if-no-files-found: warn
          retention-days: 14

      - name: Package proof artifacts
        if: steps.trigger.outputs.enabled == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r08-proof
          cp native/Chrovelo-R08-custom-libmpv-arm64.aar r08-proof/Chrovelo-R08-custom-libmpv-arm64.aar
          cp native/mpv-android/buildscripts/prefix/arm64/lib/libmpv.so r08-proof/libmpv-arm64.so
          cp /tmp/r08-libmpv-program-headers.txt r08-proof/libmpv-program-headers.txt
          cp /tmp/r08-aar-elf-alignment.txt r08-proof/aar-elf-alignment.txt
          cp /tmp/r08-ffmpeg-commit.txt r08-proof/ffmpeg-commit.txt
          cp /tmp/r08-mpv-commits.txt r08-proof/mpv-commits.txt
          APK=$(find app/build/outputs/apk -type f -name '*arm64-v8a*.apk' | head -n 1)
          if [[ -z "$APK" ]]; then
            APK=$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          fi
          test -n "$APK"
          cp "$APK" r08-proof/Chrovelo-R08-resident-Pixel9ProXL-debug.apk
          sha256sum r08-proof/* > r08-proof/SHA256SUMS.txt

      - name: Upload R08 native proof
        if: steps.trigger.outputs.enabled == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: Chrovelo-R08-custom-libmpv-proof-${{ github.sha }}
          path: r08-proof/
          if-no-files-found: error
          retention-days: 14

      - name: Commit validated R08 source and patched AAR
        if: >-
          success() &&
          steps.trigger.outputs.enabled == 'yes' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/agent/upstream-refactor' &&
          github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            app/libs/mpv-android-lib-v0.0.1.aar \
            app/src/main/assets/mpvlab/source/scripts/pixel9-shader-lab.lua \
            app/src/main/assets/mpvlab/source/engine-manifest.json \
            app/src/main/java/app/marlboroadvance/mpvex/repository/shaderlab/bridge/MpvShaderLabBridge.kt \
            app/src/test/java/app/marlboroadvance/mpvex/repository/shaderlab/bridge/MpvShaderLabBridgeTest.kt
          if git diff --cached --quiet; then
            echo 'R08 payload already integrated; nothing to commit.'
            exit 0
          fi
          git commit -m 'R08 integrate resident libmpv and Lua state sync'
          git push origin HEAD:agent/upstream-refactor
