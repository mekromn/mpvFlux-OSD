name: R08 Custom libmpv Proof

on:
  push:
    branches:
      - agent/upstream-refactor
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r08-libmpv-proof
  cancel-in-progress: true

jobs:
  build-arm64:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check R08 trigger
        id: trigger
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || -f .github/R08_LIBMPV_PROBE_TRIGGER ]]; then
            echo 'enabled=yes' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=no' >> "$GITHUB_OUTPUT"
          fi

      - name: Finalize R08 resident source compatibility
        if: steps.trigger.outputs.enabled == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          def replace_once(path: Path, old: str, new: str):
              text = path.read_text()
              if new in text:
                  return False
              count = text.count(old)
              assert count == 1, f"{path}: expected one anchor, found {count}"
              path.write_text(text.replace(old, new, 1))
              return True

          lua = Path('app/src/main/assets/mpvlab/source/scripts/pixel9-shader-lab.lua')
          lua_anchor = '''local function native_set_by_key(key, value)\n'''
          lua_insert = '''-- R08 resident transport compatibility cache. Android owns ordinary\n-- resident GPU tuning, but legacy Lua preset/state files still serialize B.\n-- This updates that in-memory bank without applying properties, generating\n-- GLSL, writing runtime shader files, or changing the shader list.\nlocal function resident_cache_sync(snapshot)\n    if type(snapshot) ~= "string" then return false end\n    local touched = false\n    for token in snapshot:gmatch("[^;]+") do\n        local key, value = token:match("^([^=]+)=([%+%-%.%deE]+)$")\n        local it = key and by_key[key] or nil\n        local num = tonumber(value)\n        if it and it.kind ~= "action" and num then\n            B[key] = round_if_needed(clamp(num, it.min, it.max), it.integer)\n            if it.kind == "granularity" then step_mode = B[key] end\n            touched = true\n        end\n    end\n    enforce_order(B, "")\n    sync_granularity_item()\n    return touched\nend\n\nlocal function native_set_by_key(key, value)\n'''
          replace_once(lua, lua_anchor, lua_insert)

          reg_anchor = '''mp.register_script_message("p9lab-native-state", publish_native_state)\nmp.register_script_message("p9lab-native-set", native_set_by_key)\n'''
          reg_insert = '''mp.register_script_message("p9lab-native-state", publish_native_state)\nmp.register_script_message("p9lab-native-set", native_set_by_key)\nmp.register_script_message("p9lab-native-user-save-r08", function(slot, snapshot)\n    native_invoke("Save user preset", false, function()\n        resident_cache_sync(snapshot)\n        B.USER_SLOT = clamp(tonumber(slot) or B.USER_SLOT, 1, 10)\n        return save_user_preset(B.USER_SLOT)\n    end)\nend)\nmp.register_script_message("p9lab-native-save-state-r08", function(snapshot)\n    native_invoke("Save state", false, function()\n        resident_cache_sync(snapshot)\n        return save_state()\n    end)\nend)\n'''
          replace_once(lua, reg_anchor, reg_insert)

          bridge = Path('app/src/main/java/app/marlboroadvance/mpvex/repository/shaderlab/bridge/MpvShaderLabBridge.kt')
          replace_once(
              bridge,
              '''  override fun saveUserPreset(preset: ShaderLabPresetId.User) =\n    scriptMessage("p9lab-native-user-save", preset.slot.toString())\n''',
              '''  override fun saveUserPreset(preset: ShaderLabPresetId.User) =\n    scriptMessage(\n      "p9lab-native-user-save-r08",\n      preset.slot.toString(),\n      luaStateSnapshot(),\n    )\n''',
          )
          replace_once(
              bridge,
              '''  override fun saveState() =\n    scriptMessage("p9lab-native-save-state")\n''',
              '''  override fun saveState() =\n    scriptMessage("p9lab-native-save-state-r08", luaStateSnapshot())\n''',
          )
          bridge_helper_anchor = '''    private fun formatDouble(value: Double): String = String.format(Locale.US, "%.17g", value)\n\n    private fun sourceKind(gamma: String): ShaderLabSourceKind =\n'''
          bridge_helper_insert = '''    private fun formatDouble(value: Double): String = String.format(Locale.US, "%.17g", value)\n\n    private fun luaStateSnapshot(): String {\n      val normalized = ShaderLabControlCatalog.normalizeValues(_state.value.values)\n      return ShaderLabControlCatalog.controls.joinToString(";") { spec ->\n        "${spec.id.legacyKey}=${formatDouble(normalized.getValue(spec.id))}"\n      }\n    }\n\n    private fun sourceKind(gamma: String): ShaderLabSourceKind =\n'''
          replace_once(bridge, bridge_helper_anchor, bridge_helper_insert)

          test = Path('app/src/test/java/app/marlboroadvance/mpvex/repository/shaderlab/bridge/MpvShaderLabBridgeTest.kt')
          test_anchor = '''  @Test\n  fun externalMpvPropertyObservationUpdatesStateImmediately() {\n'''
          test_insert = '''  @Test\n  fun saveCompatibilityActionsCarryCurrentResidentAndMpvStateWithoutLegacyApply() {\n    val transport = FakeTransport()\n    val bridge = MpvShaderLabBridge(transport)\n    bridge.attach()\n    bridge.setValues(\n      linkedMapOf(\n        ShaderLabControlId.LUMA_CONTRAST to 0.31,\n        ShaderLabControlId.MPV_BRIGHTNESS to 4.25,\n      ),\n    )\n    transport.commands.clear()\n\n    bridge.saveUserPreset(ShaderLabPresetId.User(3))\n    bridge.saveState()\n\n    val preset = transport.commands.single { it.getOrNull(1) == "p9lab-native-user-save-r08" }\n    assertEquals("3", preset[2])\n    assertTrue(preset[3].contains("LUMA_CONTRAST=0.31000000000000000"))\n    assertTrue(preset[3].contains("brightness=4.2500000000000000"))\n    val state = transport.commands.single { it.getOrNull(1) == "p9lab-native-save-state-r08" }\n    assertTrue(state[2].contains("LUMA_CONTRAST=0.31000000000000000"))\n    assertTrue(state[2].contains("brightness=4.2500000000000000"))\n    assertFalse(transport.commands.any { it.getOrNull(1) == "p9lab-native-set" })\n    assertFalse(transport.commands.any { it.firstOrNull() == "change-list" })\n  }\n\n  @Test\n  fun externalMpvPropertyObservationUpdatesStateImmediately() {\n'''
          replace_once(test, test_anchor, test_insert)

          manifest_path = Path('app/src/main/assets/mpvlab/source/engine-manifest.json')
          manifest = json.loads(manifest_path.read_text())
          manifest['engineVersion'] = '6.1.1-source-r08-resident-2'
          lua_bytes = lua.read_bytes()
          for entry in manifest['files']:
              if entry['path'] == 'scripts/pixel9-shader-lab.lua':
                  entry['bytes'] = len(lua_bytes)
                  entry['sha256'] = hashlib.sha256(lua_bytes).hexdigest()
                  break
          else:
              raise AssertionError('Lua payload missing from engine manifest')
          manifest['sourceProvenance']['r08ResidentTransport'] = (
              'R08 resident-2: vo=gpu PARAM shader with complete glsl-shader-opts transport; '
              'Lua preset/state saves receive state-only cache synchronization without ordinary GLSL regeneration.'
          )
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')
          PY

          grep -F 'p9lab-native-user-save-r08' app/src/main/assets/mpvlab/source/scripts/pixel9-shader-lab.lua
          grep -F 'p9lab-native-save-state-r08' app/src/main/assets/mpvlab/source/scripts/pixel9-shader-lab.lua
          grep -F 'luaStateSnapshot()' app/src/main/java/app/marlboroadvance/mpvex/repository/shaderlab/bridge/MpvShaderLabBridge.kt
          python3 tools/verify_mpvlab_manifest.py

      - name: Install native build dependencies
        if: steps.trigger.outputs.enabled == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y autoconf automake libtool pkg-config ninja-build gperf python3-pip nasm yasm lua5.2
          python3 -m pip install --user --upgrade 'meson>=1.6.1'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/meson" --version
          lua5.2 -e 'assert(loadfile("app/src/main/assets/mpvlab/source/scripts/pixel9-shader-lab.lua"))'

      - name: Fetch pinned mpv-android build harness
        if: steps.trigger.outputs.enabled == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/Secozzi/mpv-android.git native/mpv-android
          cd native/mpv-android
          git checkout fd17fb02cfb8c8b5c12621c2c90769685d635d91

      - name: Fetch dependencies and pin proven mpv renderer baseline
        if: steps.trigger.outputs.enabled == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          cd native/mpv-android/buildscripts
          ./download.sh
          cd deps/mpv
          git config gc.auto 0
          git fetch --no-tags --depth=3 origin \
            d54bad5636924ab3f39cb6e397b94b6aa8a7c433 \
            91ceffce42534a45705617036b6b2a392a32fc57 \
            0d655fe66590009e1d77a17581257d677286531a
          git checkout --detach d54bad5636924ab3f39cb6e397b94b6aa8a7c433
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git cherry-pick 91ceffce42534a45705617036b6b2a392a32fc57
          git cherry-pick 0d655fe66590009e1d77a17581257d677286531a

      - name: Apply Chrovelo narrow native patches
        if: steps.trigger.outputs.enabled == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          cd native/mpv-android
          python3 - <<'PY'
          from pathlib import Path

          header = Path('buildscripts/deps/mpv/video/out/gpu/user_shaders.h')
          text = header.read_text()
          old = '#define SHADER_MAX_PARAMS 16'
          assert text.count(old) == 1, text.count(old)
          header.write_text(text.replace(old, '#define SHADER_MAX_PARAMS 64', 1))

          buildall = Path('buildscripts/buildall.sh')
          text = buildall.read_text()
          old = 'export LDFLAGS="-Wl,-O1,--icf=safe -Wl,-z,max-page-size=16384"'
          new = 'export LDFLAGS="-Wl,-O1,--icf=safe -Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384"'
          assert text.count(old) == 1, text.count(old)
          buildall.write_text(text.replace(old, new, 1))
          PY
          grep -F '#define SHADER_MAX_PARAMS 64' buildscripts/deps/mpv/video/out/gpu/user_shaders.h
          grep -F -- '-Wl,-z,common-page-size=16384' buildscripts/buildall.sh

      - name: Build arm64 custom libmpv and AAR
        if: steps.trigger.outputs.enabled == 'yes'
        shell: bash
        env:
          DONT_BUILD_RELEASE: ''
          GRADLE_OPTS: -Xmx4G
        run: |
          set -euo pipefail
          cd native/mpv-android/buildscripts
          ./buildall.sh --arch arm64 mpv 2>&1 | tee /tmp/r08-native-build.log
          ./buildall.sh --arch arm64 mpv-android 2>&1 | tee -a /tmp/r08-native-build.log

      - name: Collect native failure diagnostics
        if: failure() && steps.trigger.outputs.enabled == 'yes'
        shell: bash
        run: |
          set +e
          mkdir -p r08-native-failure
          cp /tmp/r08-native-build.log r08-native-failure/native-build.log 2>/dev/null || true
          find native/mpv-android -type f -name 'meson-log.txt' -print | while read -r log; do
            dest="r08-native-failure/${log#native/mpv-android/}"
            mkdir -p "$(dirname "$dest")"
            cp "$log" "$dest"
          done
          git -C native/mpv-android/buildscripts/deps/mpv status --short > r08-native-failure/mpv-status.txt 2>&1 || true
          git -C native/mpv-android/buildscripts/deps/mpv log -4 --format='%H %s' > r08-native-failure/mpv-commits.txt 2>&1 || true

      - name: Upload native failure diagnostics
        if: failure() && steps.trigger.outputs.enabled == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: Chrovelo-R08-native-build-failure-${{ github.sha }}
          path: r08-native-failure/
          if-no-files-found: warn
          retention-days: 14

      - name: Verify native feature and 16 KB ELF alignment
        if: steps.trigger.outputs.enabled == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          cd native/mpv-android
          test -f lib/build/outputs/aar/lib-release.aar
          test -f buildscripts/prefix/arm64/lib/libmpv.so
          grep -F '#define SHADER_MAX_PARAMS 64' buildscripts/deps/mpv/video/out/gpu/user_shaders.h
          git -C buildscripts/deps/mpv log -3 --oneline
          readelf -lW buildscripts/prefix/arm64/lib/libmpv.so | tee /tmp/libmpv-program-headers.txt
          python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/libmpv-program-headers.txt').read_text()
          loads = [line for line in text.splitlines() if line.lstrip().startswith('LOAD')]
          assert loads, 'no LOAD segments found'
          bad = []
          for line in loads:
              parts = line.split()
              align = int(parts[-1], 16)
              if align < 0x4000:
                  bad.append(line)
          assert not bad, 'LOAD segments below 16 KB alignment:\n' + '\n'.join(bad)
          print('16 KB ELF LOAD alignment PASS')
          PY
          sha256sum lib/build/outputs/aar/lib-release.aar buildscripts/prefix/arm64/lib/libmpv.so

      - name: Compile Chrovelo against replacement AAR
        if: steps.trigger.outputs.enabled == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          cp native/mpv-android/lib/build/outputs/aar/lib-release.aar app/libs/mpv-android-lib-v0.0.1.aar
          chmod +x ./gradlew
          python3 tools/verify_mpvlab_manifest.py
          python3 - <<'PY'
          from pathlib import Path
          shader = Path('app/src/main/assets/mpvlab/source/shaders/pixel9-perceptual-expansion-resident-v3.1.glsl').read_text()
          assert '@@' not in shader, 'resident shader contains unresolved template token'
          assert shader.count('//!PARAM ') == 39, shader.count('//!PARAM ')
          print('Resident shader PARAM audit PASS: 39')
          PY
          ./gradlew :app:testStandardDebugUnitTest :app:assembleStandardDebug --stacktrace

      - name: Package proof artifacts
        if: steps.trigger.outputs.enabled == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r08-proof
          cp native/mpv-android/lib/build/outputs/aar/lib-release.aar r08-proof/Chrovelo-R08-custom-libmpv-arm64.aar
          cp native/mpv-android/buildscripts/prefix/arm64/lib/libmpv.so r08-proof/libmpv-arm64.so
          cp /tmp/libmpv-program-headers.txt r08-proof/libmpv-program-headers.txt
          git -C native/mpv-android/buildscripts/deps/mpv log -3 --format='%H %s' > r08-proof/mpv-commits.txt
          find app/build/outputs/apk -type f -name '*arm64-v8a*.apk' -print -exec cp {} r08-proof/Chrovelo-R08-custom-libmpv-arm64-debug.apk \; | head -n 1
          sha256sum r08-proof/* > r08-proof/SHA256SUMS.txt

      - name: Upload R08 native proof
        if: steps.trigger.outputs.enabled == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: Chrovelo-R08-custom-libmpv-proof-${{ github.sha }}
          path: r08-proof/
          if-no-files-found: error
          retention-days: 14

      - name: Commit validated R08 source and custom AAR
        if: >-
          success() &&
          steps.trigger.outputs.enabled == 'yes' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/agent/upstream-refactor' &&
          github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            app/libs/mpv-android-lib-v0.0.1.aar \
            app/src/main/assets/mpvlab/source/scripts/pixel9-shader-lab.lua \
            app/src/main/assets/mpvlab/source/engine-manifest.json \
            app/src/main/java/app/marlboroadvance/mpvex/repository/shaderlab/bridge/MpvShaderLabBridge.kt \
            app/src/test/java/app/marlboroadvance/mpvex/repository/shaderlab/bridge/MpvShaderLabBridgeTest.kt
          if git diff --cached --quiet; then
            echo 'R08 payload already integrated; nothing to commit.'
            exit 0
          fi
          git commit -m 'R08 integrate resident libmpv and Lua state sync'
          git push origin HEAD:agent/upstream-refactor
