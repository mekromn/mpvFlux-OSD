name: R08 Custom libmpv Proof

on:
  push:
    branches:
      - agent/upstream-refactor
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: r08-libmpv-proof-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  observe-push:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Report matching push proof run
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Looking for R08 push proof run for head SHA: $HEAD_SHA"
          for attempt in $(seq 1 24); do
            json="$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/r08-libmpv-probe.yml/runs" \
              -f branch=agent/upstream-refactor \
              -f event=push \
              -f per_page=20)"
            run_id="$(printf '%s' "$json" | python3 -c '
import json, os, sys
obj=json.load(sys.stdin)
sha=os.environ["HEAD_SHA"]
for run in obj.get("workflow_runs", []):
    if run.get("head_sha") == sha:
        print(run.get("id", ""))
        break
')"
            if [[ -n "$run_id" ]]; then
              echo "PUSH_RUN_ID=$run_id"
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
                --jq '"PUSH_RUN_STATUS=\(.status) PUSH_RUN_CONCLUSION=\(.conclusion) URL=\(.html_url)"'
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" \
                --jq '.jobs[] | "PUSH_JOB_ID=\(.id) NAME=\(.name) STATUS=\(.status) CONCLUSION=\(.conclusion)"'
              exit 0
            fi
            echo "Push proof run not indexed yet (attempt $attempt/24)."
            sleep 5
          done
          echo '::error::No matching R08 push proof run found.'
          exit 1

  build-arm64:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check R08 renderer-parity trigger
        id: trigger
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || -f .github/R08_RENDERER_PARITY_TRIGGER ]]; then
            echo 'enabled=yes' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=no' >> "$GITHUB_OUTPUT"
          fi

      - name: Build metadata
        if: steps.trigger.outputs.enabled == 'yes'
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "base_version_code=$(( $(date +%s) / 10 ))" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        if: steps.trigger.outputs.enabled == 'yes'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install native build dependencies
        if: steps.trigger.outputs.enabled == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y autoconf automake libtool pkg-config ninja-build gperf python3-pip nasm yasm lua5.2 zip unzip binutils wget
          python3 -m pip install --user --upgrade 'meson>=1.6.1'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/meson" --version

      - name: Verify resident source
        if: steps.trigger.outputs.enabled == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_mpvlab_manifest.py
          lua5.2 -e 'assert(loadfile("app/src/main/assets/mpvlab/source/scripts/pixel9-shader-lab.lua"))'
          python3 - <<'PY'
          from pathlib import Path
          shader = Path('app/src/main/assets/mpvlab/source/shaders/pixel9-perceptual-expansion-resident-v3.1.glsl').read_text()
          assert '@@' not in shader, 'resident shader contains unresolved template token'
          assert shader.count('//!PARAM ') == 39, shader.count('//!PARAM ')
          print('Resident shader PARAM audit PASS: 39')
          PY

      - name: Rebuild exact R07 Vulkan renderer plus R08 PARAM support
        if: steps.trigger.outputs.enabled == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          bash tools/r08_renderer_parity_rebuild.sh

      - name: Build renderer-parity MPVLib AAR
        if: steps.trigger.outputs.enabled == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          BASE_AAR=app/libs/mpv-android-lib-v0.0.1.aar
          NEW_LIB=native/mpv-android/buildscripts/prefix/arm64/lib/libmpv.so
          test -f "$BASE_AAR"
          test -f "$NEW_LIB"

          rm -rf native/parity-aar
          mkdir -p native/parity-aar
          unzip -q "$BASE_AAR" -d native/parity-aar

          test -f native/parity-aar/classes.jar
          test -f native/parity-aar/jni/arm64-v8a/libplayer.so
          test -f native/parity-aar/jni/arm64-v8a/libavdevice.so
          test -f native/parity-aar/jni/arm64-v8a/libxml2.so
          jar tf native/parity-aar/classes.jar | grep -Fx 'is/xyz/mpv/MPVLib.class'
          jar tf native/parity-aar/classes.jar | grep -Fx 'is/xyz/mpv/MPVNode.class'
          strings native/parity-aar/jni/arm64-v8a/libavdevice.so | grep -F 'FFmpeg version N-122998-g5ba2525c7a'
          sha256sum native/parity-aar/classes.jar native/parity-aar/jni/arm64-v8a/libplayer.so > /tmp/r08-wrapper-before.sha256

          cp "$NEW_LIB" native/parity-aar/jni/arm64-v8a/libmpv.so

          lib=native/parity-aar/jni/arm64-v8a/libmpv.so
          strings "$lib" | grep -F 'N-122998-g5ba2525c7a'
          strings "$lib" | grep -F 'v7.360.0 (v7.360.0-3-gc93aa134)'
          strings "$lib" | grep -F -- '-Dvulkan=enabled'
          strings "$lib" | grep -F 'pl_vulkan_create'
          readelf -dW "$lib" | grep -F 'Shared library: [libvulkan.so]'
          readelf -dW "$lib" | grep -F 'Shared library: [libxml2.so]'

          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          root = Path('native/parity-aar/jni/arm64-v8a')
          local = {p.name for p in root.glob('*.so')}
          system = {
              'libc.so', 'libm.so', 'libdl.so', 'liblog.so', 'libandroid.so',
              'libz.so', 'libEGL.so', 'libGLESv2.so', 'libGLESv3.so',
              'libOpenSLES.so', 'libmediandk.so', 'libvulkan.so', 'libaaudio.so',
              'libjnigraphics.so', 'libnativewindow.so',
          }
          missing = []
          report = []
          for so in sorted(root.glob('*.so')):
              dynamic = subprocess.check_output(['readelf', '-dW', str(so)], text=True)
              needed = re.findall(r'Shared library: \[([^]]+)\]', dynamic)
              report.append(f"{so.name}: {', '.join(needed) if needed else '<none>'}")
              for dep in needed:
                  if dep not in local and dep not in system:
                      missing.append(f'{so.name} -> {dep}')

              program = subprocess.check_output(['readelf', '-lW', str(so)], text=True)
              loads = [line for line in program.splitlines() if line.lstrip().startswith('LOAD')]
              assert loads, f'{so.name}: no LOAD segments'
              minimum = min(int(line.split()[-1], 16) for line in loads)
              assert minimum >= 0x4000, f'{so.name}: LOAD alignment 0x{minimum:x} < 0x4000'

          Path('/tmp/r08-parity-aar-needed.txt').write_text('\n'.join(report) + '\n')
          print('\n'.join(report))
          assert not missing, 'unresolved packaged ELF dependencies: ' + ', '.join(missing)
          assert 'libxml2.so' in local, 'libxml2.so runtime repair missing'
          print('Renderer-parity AAR dependency closure + 16 KB alignment PASS')
          PY

          rm -f native/mpv-android-lib-v0.0.1.renderer-parity.aar
          (cd native/parity-aar && zip -q -r ../mpv-android-lib-v0.0.1.renderer-parity.aar .)
          cp native/mpv-android-lib-v0.0.1.renderer-parity.aar "$BASE_AAR"

          rm -rf /tmp/r08-aar-check
          mkdir -p /tmp/r08-aar-check
          unzip -q "$BASE_AAR" -d /tmp/r08-aar-check
          sha256sum /tmp/r08-aar-check/classes.jar /tmp/r08-aar-check/jni/arm64-v8a/libplayer.so > /tmp/r08-wrapper-after.sha256
          diff -u /tmp/r08-wrapper-before.sha256 /tmp/r08-wrapper-after.sha256

      - name: Run Shader Lab unit tests
        if: steps.trigger.outputs.enabled == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          python3 tools/verify_mpvlab_manifest.py
          ./gradlew :app:testStandardDebugUnitTest --stacktrace 2>&1 | tee /tmp/r08-renderer-parity-gradle-test.log

      - name: Prepare persistent signing identity
        if: steps.trigger.outputs.enabled == 'yes'
        shell: bash
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_KEY_ALIAS_VALUE: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD_VALUE: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD_VALUE: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$SIGNING_KEYSTORE_B64" "$SIGNING_KEY_ALIAS_VALUE" "$SIGNING_STORE_PASSWORD_VALUE" "$SIGNING_KEY_PASSWORD_VALUE"; do
            [[ -n "$value" ]] || { echo '::error::Persistent signing secret missing'; exit 1; }
          done
          keystore="$RUNNER_TEMP/chrovelo-persistent.keystore"
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "CHROVELO_SIGNING_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
          echo "CHROVELO_SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS_VALUE" >> "$GITHUB_ENV"
          echo "CHROVELO_SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD_VALUE" >> "$GITHUB_ENV"
          echo "CHROVELO_SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD_VALUE" >> "$GITHUB_ENV"

      - name: Build renderer-parity Pixel APK
        if: steps.trigger.outputs.enabled == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleStandardDebug \
            -PchroveloVersionCode=${{ steps.meta.outputs.base_version_code }} \
            --stacktrace 2>&1 | tee /tmp/r08-renderer-parity-gradle-build.log
          mkdir -p output/proof
          apk="$(find app/build/outputs/apk/standard/debug -maxdepth 1 -type f -name 'app-standard-arm64-v8a-debug.apk' -print -quit)"
          [[ -n "$apk" ]] || { echo '::error::arm64 Debug APK not found'; exit 1; }
          cp "$apk" "output/proof/Chrovelo-R08-renderer-parity-${{ steps.meta.outputs.short_sha }}-arm64-v8a.apk"

      - name: Verify final APK renderer fingerprint and signing
        if: steps.trigger.outputs.enabled == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          apk="output/proof/Chrovelo-R08-renderer-parity-${{ steps.meta.outputs.short_sha }}-arm64-v8a.apk"
          rm -rf /tmp/r08-parity-apk
          mkdir -p /tmp/r08-parity-apk
          unzip -q "$apk" 'lib/arm64-v8a/*.so' -d /tmp/r08-parity-apk
          lib=/tmp/r08-parity-apk/lib/arm64-v8a/libmpv.so
          test -f "$lib"
          test -f /tmp/r08-parity-apk/lib/arm64-v8a/libxml2.so
          strings "$lib" | grep -F 'N-122998-g5ba2525c7a'
          strings "$lib" | grep -F 'v7.360.0 (v7.360.0-3-gc93aa134)'
          strings "$lib" | grep -F -- '-Dvulkan=enabled'
          strings "$lib" | grep -F 'pl_vulkan_create'
          readelf -dW "$lib" | grep -F 'Shared library: [libvulkan.so]'
          readelf -dW "$lib" | grep -F 'Shared library: [libxml2.so]'

          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk" | tee output/proof/apksigner.txt
          grep -Fi 'b582b2f37a1bfbf1089405941b20b184c104f35a0ba38068f8ffde74fd3965a2' output/proof/apksigner.txt
          sha256sum "$apk" | tee output/proof/SHA256SUMS.txt
          cp /tmp/r08-renderer-parity-fingerprint.txt output/proof/renderer-fingerprint.txt
          cp /tmp/r08-parity-aar-needed.txt output/proof/aar-needed.txt
          cp /tmp/r08-renderer-parity-dynamic.txt output/proof/libmpv-dynamic.txt
          cp /tmp/r08-renderer-parity-program-headers.txt output/proof/libmpv-program-headers.txt

      - name: Upload renderer-parity Pixel proof
        if: steps.trigger.outputs.enabled == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: Chrovelo-R08-renderer-parity-arm64-${{ steps.meta.outputs.short_sha }}
          path: output/proof/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Collect failure diagnostics
        if: failure() && steps.trigger.outputs.enabled == 'yes'
        shell: bash
        run: |
          set +e
          mkdir -p r08-failure
          cp /tmp/r08-renderer-parity-native-build.log r08-failure/ 2>/dev/null || true
          cp /tmp/r08-renderer-parity-gradle-test.log r08-failure/ 2>/dev/null || true
          cp /tmp/r08-renderer-parity-gradle-build.log r08-failure/ 2>/dev/null || true
          cp /tmp/r08-renderer-parity-fingerprint.txt r08-failure/ 2>/dev/null || true
          cp /tmp/r08-renderer-parity-dynamic.txt r08-failure/ 2>/dev/null || true
          cp /tmp/r08-renderer-parity-program-headers.txt r08-failure/ 2>/dev/null || true
          find native/mpv-android -type f -name 'meson-log.txt' -print | while read -r log; do
            dest="r08-failure/${log#native/mpv-android/}"
            mkdir -p "$(dirname "$dest")"
            cp "$log" "$dest"
          done

      - name: Upload failure diagnostics
        if: failure() && steps.trigger.outputs.enabled == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: Chrovelo-R08-renderer-parity-failure-${{ steps.meta.outputs.short_sha }}
          path: r08-failure/
          if-no-files-found: warn
          retention-days: 14

      - name: Commit validated renderer-parity AAR
        if: success() && steps.trigger.outputs.enabled == 'yes' && github.event_name == 'push' && github.ref_name == 'agent/upstream-refactor'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app/libs/mpv-android-lib-v0.0.1.aar
          if git diff --cached --quiet; then
            echo 'Renderer-parity AAR already committed.'
            exit 0
          fi
          git commit -m 'R08 restore R07 Vulkan renderer parity'
          git push origin HEAD:agent/upstream-refactor
