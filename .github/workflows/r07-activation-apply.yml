name: R07 Guarded Controller Activation Apply

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply-r07-activation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: agent/upstream-refactor
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Apply guarded R07 controller activation patch
        run: python3 tools/r07_activation_patch.py

      - name: Run Shader Lab unit tests on activation-patched tree
        run: ./gradlew :app:testStandardDebugUnitTest --stacktrace

      - name: Commit verified activation and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r07-activation-apply.yml tools/r07_activation_patch.py
          git add -- \
            app/src/main/java/app/marlboroadvance/mpvex/repository/shaderlab/bridge/MpvShaderLabBridge.kt \
            app/src/main/java/app/marlboroadvance/mpvex/di/ShaderLabModule.kt \
            app/src/test/java/app/marlboroadvance/mpvex/repository/shaderlab/bridge/MpvShaderLabBridgeTest.kt
          git diff --cached --check
          git commit -m "R07 ensure canonical controller activation"
          git push origin HEAD:agent/upstream-refactor
