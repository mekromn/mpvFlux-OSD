name: R07 User Data Root Fallback Apply V2

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/upstream-refactor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/upstream-refactor
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check repair trigger
        id: trigger
        shell: bash
        run: |
          if [[ -f .github/R07_USER_DATA_ROOT_FALLBACK_TRIGGER ]]; then
            echo 'enabled=yes' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=no' >> "$GITHUB_OUTPUT"
          fi

      - name: Apply corrected R07 user-data root fallback
        if: steps.trigger.outputs.enabled == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one guarded match, found {count}")
              p.write_text(text.replace(old, new, 1))

          bridge = Path('app/src/main/java/app/marlboroadvance/mpvex/repository/shaderlab/bridge/MpvShaderLabBridge.kt')
          test = Path('app/src/test/java/app/marlboroadvance/mpvex/repository/shaderlab/bridge/MpvShaderLabBridgeTest.kt')
          lua = Path('app/src/main/assets/mpvlab/source/scripts/pixel9-shader-lab.lua')
          manifest = Path('app/src/main/assets/mpvlab/source/engine-manifest.json')

          replace_once(
              bridge,
              '''        transport.observeString(NATIVE_STATE_PROPERTY)\n        transport.observeString(LUA_PROBE_PROPERTY)\n        transport.observeString(SOURCE_GAMMA_PROPERTY)''',
              '''        transport.observeString(NATIVE_STATE_PROPERTY)\n        transport.observeString(USER_DATA_ROOT_PROPERTY)\n        transport.observeString(SOURCE_GAMMA_PROPERTY)''',
          )
          replace_once(
              bridge,
              '''        val nativeState = transport.getString(NATIVE_STATE_PROPERTY)\n        transport.getString(LUA_PROBE_PROPERTY)?.let { syncProbe.stage("lua_probe_readback", it) }\n        nativeState''',
              '''        val nativeState = readNativeState()\n        nativeState''',
          )
          replace_once(
              bridge,
              '''              val luaProbe = transport.getString(LUA_PROBE_PROPERTY) ?: "<null>"\n              val userDataRoot = transport.getString("user-data") ?: "<null>"\n              syncProbe.stage(\n                "timeout",\n                "No native-state snapshot; lua_probe=$luaProbe; user_data_root=${userDataRoot.take(240)}",\n              )''',
              '''              val directState = transport.getString(NATIVE_STATE_PROPERTY) ?: "<null>"\n              val userDataRoot = transport.getString(USER_DATA_ROOT_PROPERTY) ?: "<null>"\n              syncProbe.stage(\n                "timeout",\n                "No native-state snapshot after direct/root user-data read; direct=${directState.take(120)}; root=${userDataRoot.take(240)}",\n              )''',
          )
          replace_once(
              bridge,
              '''  private fun requestNativeStateHandshake(stage: String) {\n    syncProbe.stage("handshake_$stage")\n    val current = transport.getString(NATIVE_STATE_PROPERTY)\n    if (!current.isNullOrBlank()) {\n      consumeNativeState(current)\n      return\n    }\n    transport.command("script-message", "p9lab-native-state")\n  }''',
              '''  private fun requestNativeStateHandshake(stage: String) {\n    syncProbe.stage("handshake_$stage")\n    val current = readNativeState()\n    if (!current.isNullOrBlank()) {\n      consumeNativeState(current)\n      return\n    }\n    transport.command("script-message", "p9lab-native-state")\n  }\n\n  private fun readNativeState(): String? =\n    transport.getString(NATIVE_STATE_PROPERTY)\n      ?.takeIf { it.isNotBlank() }\n      ?: transport.getString(USER_DATA_ROOT_PROPERTY)\n        ?.let(ShaderLabUserDataCodec::extractNativeState)\n        ?.takeIf { it.isNotBlank() }''',
          )
          replace_once(
              bridge,
              '''      property == NATIVE_STATE_PROPERTY && value is ShaderLabMpvValue.Text -> {\n        consumeNativeState(value.value)\n      }\n      property == LUA_PROBE_PROPERTY && value is ShaderLabMpvValue.Text -> {\n        syncProbe.stage("lua_probe_observed", value.value)\n      }\n      property == SOURCE_GAMMA_PROPERTY''',
              '''      property == NATIVE_STATE_PROPERTY && value is ShaderLabMpvValue.Text -> {\n        consumeNativeState(value.value)\n      }\n      property == USER_DATA_ROOT_PROPERTY && value is ShaderLabMpvValue.Text -> {\n        ShaderLabUserDataCodec.extractNativeState(value.value)?.let(::consumeNativeState)\n      }\n      property == SOURCE_GAMMA_PROPERTY''',
          )
          replace_once(
              bridge,
              '''    const val NATIVE_STATE_PROPERTY = "user-data/p9lab/native-state"\n    const val LUA_PROBE_PROPERTY = "user-data/p9lab/lua-probe"\n    const val SOURCE_GAMMA_PROPERTY = "video-params/gamma"''',
              '''    const val NATIVE_STATE_PROPERTY = "user-data/p9lab/native-state"\n    const val USER_DATA_ROOT_PROPERTY = "user-data"\n    const val SOURCE_GAMMA_PROPERTY = "video-params/gamma"''',
          )
          replace_once(
              bridge,
              '''internal object ShaderLabNativeStateCodec {''',
              '''internal object ShaderLabUserDataCodec {\n  private const val NATIVE_STATE_KEY = "native-state"\n\n  fun extractNativeState(raw: String): String? {\n    val keyIndex = raw.indexOf(NATIVE_STATE_KEY)\n    if (keyIndex < 0) return null\n    val colonIndex = raw.indexOf(':', keyIndex + NATIVE_STATE_KEY.length)\n    if (colonIndex < 0) return null\n\n    var index = colonIndex + 1\n    while (index < raw.length && raw[index].isWhitespace()) index += 1\n    if (index >= raw.length || raw[index] != '\"') return null\n    index += 1\n\n    val encoded = StringBuilder()\n    var escaped = false\n    while (index < raw.length) {\n      val char = raw[index++]\n      if (!escaped && char == '\"') return decodeJsonString(encoded.toString())\n      encoded.append(char)\n      if (escaped) {\n        escaped = false\n      } else if (char == '\\\\') {\n        escaped = true\n      }\n    }\n    return null\n  }\n\n  private fun decodeJsonString(encoded: String): String? {\n    val decoded = StringBuilder(encoded.length)\n    var index = 0\n    while (index < encoded.length) {\n      val char = encoded[index++]\n      if (char != '\\\\') {\n        decoded.append(char)\n        continue\n      }\n      if (index >= encoded.length) return null\n      when (val escaped = encoded[index++]) {\n        '\"', '\\\\', '/' -> decoded.append(escaped)\n        'b' -> decoded.append('\\b')\n        'f' -> decoded.append('\\u000C')\n        'n' -> decoded.append('\\n')\n        'r' -> decoded.append('\\r')\n        't' -> decoded.append('\\t')\n        'u' -> {\n          if (index + 4 > encoded.length) return null\n          val codePoint = encoded.substring(index, index + 4).toIntOrNull(16) ?: return null\n          decoded.append(codePoint.toChar())\n          index += 4\n        }\n        else -> return null\n      }\n    }\n    return decoded.toString()\n  }\n}\n\ninternal object ShaderLabNativeStateCodec {''',
          )

          replace_once(
              test,
              '''    assertTrue(MpvShaderLabBridge.NATIVE_STATE_PROPERTY in transport.stringProperties)\n    assertTrue(MpvShaderLabBridge.SOURCE_GAMMA_PROPERTY in transport.stringProperties)''',
              '''    assertTrue(MpvShaderLabBridge.NATIVE_STATE_PROPERTY in transport.stringProperties)\n    assertTrue(MpvShaderLabBridge.USER_DATA_ROOT_PROPERTY in transport.stringProperties)\n    assertTrue(MpvShaderLabBridge.SOURCE_GAMMA_PROPERTY in transport.stringProperties)''',
          )
          marker = '''  @Test\n  fun boundedHandshakeReadbackRecoversWhenLoadScriptInitializationIsDelayed() {'''
          addition = '''  @Test\n  fun attachRecoversNativeSnapshotFromUserDataRootWhenLeafStringReadIsUnavailable() {\n    val transport = FakeTransport().apply {\n      strings[MpvShaderLabBridge.USER_DATA_ROOT_PROPERTY] =\n        """{\"p9lab\":{\"ui-visible\":\"no\",\"native-state\":\"__ready=1\\n__version=6.1.1-r07-state-3\\n__serial=11\\n__bank=B\"}}"""\n    }\n    val bridge = MpvShaderLabBridge(transport)\n\n    bridge.attach()\n\n    assertTrue(bridge.state.value.ready)\n    assertEquals("6.1.1-r07-state-3", bridge.state.value.backendVersion)\n    assertEquals(11L, bridge.state.value.snapshotSerial)\n    assertEquals(ShaderLabBank.B, bridge.state.value.activeBank)\n    assertFalse(\n      transport.commands.contains(\n        listOf("load-script", MpvShaderLabBridge.CONTROLLER_PATH),\n      ),\n    )\n    assertTrue(transport.commands.none { it == listOf("script-message", "p9lab-native-state") })\n  }\n\n  @Test\n  fun observedUserDataRootSnapshotUpdatesStateWhenNestedLeafObservationIsUnavailable() {\n    val transport = FakeTransport()\n    val bridge = MpvShaderLabBridge(transport)\n    bridge.attach()\n\n    transport.emitText(\n      MpvShaderLabBridge.USER_DATA_ROOT_PROPERTY,\n      """{\"p9lab\":{\"native-state\":\"__ready=1\\n__version=6.1.1-r07-state-3\\n__serial=12\\nbrightness=7.5\"}}""",\n    )\n\n    assertTrue(bridge.state.value.ready)\n    assertEquals(12L, bridge.state.value.snapshotSerial)\n    assertEquals(7.5, bridge.state.value.values.getValue(ShaderLabControlId.MPV_BRIGHTNESS), 0.0)\n  }\n\n'''
          replace_once(test, marker, addition + marker)

          replace_once(lua, '        "__version=6.1.1-r07-state-2",', '        "__version=6.1.1-r07-state-3",')
          replace_once(
              lua,
              '''publish_ui_visibility()\nhide_ui_overlay()\n\n-- R07 device transport probe. Keep this intentionally tiny and independent\n-- of the full multiline native-state snapshot so the Android bridge can\n-- distinguish script identity, user-data write support, and payload issues.\nlocal lua_probe_value = "R07_STATE_2"\nlocal lua_probe_set_ok, lua_probe_set_err = mp.set_property("user-data/p9lab/lua-probe", lua_probe_value)\nlocal lua_probe_readback, lua_probe_read_err = mp.get_property("user-data/p9lab/lua-probe", "")\nwrite_all(ROOT .. "/logs/shaderlab-r07-lua-probe.txt", table.concat({\n    "script=R07_STATE_2",\n    "set_ok=" .. tostring(lua_probe_set_ok),\n    "set_error=" .. tostring(lua_probe_set_err or ""),\n    "readback=" .. tostring(lua_probe_readback or ""),\n    "read_error=" .. tostring(lua_probe_read_err or ""),\n}, "\\n") .. "\\n")\n\npublish_native_state()\n\nmsg.info("Pixel 9 V3.1 Shader Lab Workstation v6.1 Studio R07 STATE 2 loaded: " .. tostring(#items) .. " menu items; 10 built-ins + 10 user slots; Studio UI + Android TV remote; state-compatible")''',
              '''publish_ui_visibility()\nhide_ui_overlay()\npublish_native_state()\n\nmsg.info("Pixel 9 V3.1 Shader Lab Workstation v6.1 Studio R07 STATE 3 loaded: " .. tostring(#items) .. " menu items; 10 built-ins + 10 user slots; Studio UI + Android TV remote; state-compatible")''',
          )

          data = json.loads(manifest.read_text())
          if data.get('engineVersion') != '6.1.1-source-r07-state-2':
              raise SystemExit(f"unexpected engine version: {data.get('engineVersion')}")
          data['engineVersion'] = '6.1.1-source-r07-state-3'
          lua_bytes = lua.read_bytes()
          for entry in data['files']:
              if entry['path'] == 'scripts/pixel9-shader-lab.lua':
                  entry['bytes'] = len(lua_bytes)
                  entry['sha256'] = hashlib.sha256(lua_bytes).hexdigest()
                  break
          else:
              raise SystemExit('controller entry missing from engine manifest')
          data['sourceProvenance']['r07StateTransport'] = 'R07 state-3: event-driven native state with Android MPVLib compatibility fallback through the string-converted user-data root map.'
          manifest.write_text(json.dumps(data, indent=2) + '\n')

          Path('.github/R07_USER_DATA_ROOT_FALLBACK_TRIGGER').unlink(missing_ok=True)
          Path('.github/workflows/r07-user-data-root-fallback-apply.yml').unlink(missing_ok=True)
          Path('.github/workflows/r07-user-data-root-fallback-apply-v2.yml').unlink(missing_ok=True)
          PY

      - name: Validate repaired R07 tree
        if: steps.trigger.outputs.enabled == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('app/src/main/assets/mpvlab/source')
          manifest = json.loads((root / 'engine-manifest.json').read_text())
          for entry in manifest['files']:
              data = (root / entry['path']).read_bytes()
              if len(data) != entry['bytes']:
                  raise SystemExit(f"size mismatch: {entry['path']}")
              if hashlib.sha256(data).hexdigest() != entry['sha256']:
                  raise SystemExit(f"sha256 mismatch: {entry['path']}")
          print('Shader Lab engine manifest integrity PASS')
          PY
          ./gradlew :app:testStandardDebugUnitTest --stacktrace
          git diff --check

      - name: Commit verified R07 root fallback
        if: steps.trigger.outputs.enabled == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            app/src/main/java/app/marlboroadvance/mpvex/repository/shaderlab/bridge/MpvShaderLabBridge.kt \
            app/src/test/java/app/marlboroadvance/mpvex/repository/shaderlab/bridge/MpvShaderLabBridgeTest.kt \
            app/src/main/assets/mpvlab/source/scripts/pixel9-shader-lab.lua \
            app/src/main/assets/mpvlab/source/engine-manifest.json \
            .github/R07_USER_DATA_ROOT_FALLBACK_TRIGGER \
            .github/workflows/r07-user-data-root-fallback-apply.yml \
            .github/workflows/r07-user-data-root-fallback-apply-v2.yml
          git diff --cached --check
          git commit -m "R07 consume native state through user-data root fallback"
          git pull --rebase origin agent/upstream-refactor
          git push origin HEAD:agent/upstream-refactor
