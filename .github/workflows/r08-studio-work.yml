name: R08 Studio Integration Work

on:
  push:
    branches:
      - agent/r08-studio-integration-work

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply native-brightness-style Studio finalization
        run: |
          set -euo pipefail
          python3 tools/r08_finalize_studio_integration.py
          ! grep -F 'withFrameNanos' app/src/main/java/app/marlboroadvance/mpvex/ui/player/controls/ShaderLabStudio.kt
          ! grep -F 'FrameCoalescedShaderDispatcher' app/src/main/java/app/marlboroadvance/mpvex/ui/player/controls/ShaderLabStudio.kt
          grep -F 'commandApi.execute(ShaderLabCommand.SetValue(spec.id, value))' app/src/main/java/app/marlboroadvance/mpvex/ui/player/controls/ShaderLabStudio.kt
          grep -F 'failedLegacyAdoptionRollsBackWithoutShaderListChurn' app/src/test/java/app/marlboroadvance/mpvex/repository/shaderlab/bridge/ShaderLabResidentGpuTransportTest.kt

      - name: Run Shader Lab unit suite
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testStandardDebugUnitTest --stacktrace

      - name: Commit validated integration result
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/r08-studio-work.yml tools/r08_finalize_studio_integration.py
          git add -- \
            app/src/main/java/app/marlboroadvance/mpvex/ui/player/controls/ShaderLabStudio.kt \
            app/src/main/java/app/marlboroadvance/mpvex/repository/shaderlab/bridge/ShaderLabResidentGpuTransport.kt \
            app/src/test/java/app/marlboroadvance/mpvex/repository/shaderlab/bridge/ShaderLabResidentGpuTransportTest.kt
          git commit -m 'R08 finish native-style Studio live controls'
          git push origin HEAD:agent/r08-studio-integration-work
