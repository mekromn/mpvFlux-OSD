name: R08 Resident Architecture Replan

on:
  push:
    branches:
      - agent/upstream-refactor

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/upstream-refactor
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check trigger
        id: trigger
        shell: bash
        run: |
          if [[ -f .github/R08_REPLAN_TRIGGER && -f scripts/r08_replan.py ]]; then
            echo 'enabled=yes' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=no' >> "$GITHUB_OUTPUT"
          fi

      - name: Apply authoritative roadmap replan
        if: steps.trigger.outputs.enabled == 'yes'
        run: python3 scripts/r08_replan.py

      - name: Validate roadmap pivot
        if: steps.trigger.outputs.enabled == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'CURRENT_STEP = R08' docs/SHADER_LAB_REFACTOR_ROADMAP.md
          grep -Fq '## R08 — Resident `vo=gpu` shader + native parameter transport' docs/SHADER_LAB_REFACTOR_ROADMAP.md
          grep -Fq '**Status:** `IN_PROGRESS`' docs/SHADER_LAB_REFACTOR_ROADMAP.md
          grep -Fq 'R08_STATUS = IN_PROGRESS' docs/SHADER_LAB_REFACTOR_PROGRESS.md
          grep -Fq '0d655fe66590009e1d77a17581257d677286531a' docs/SHADER_LAB_REFACTOR_PROGRESS.md
          git diff --check

      - name: Commit replan and remove temporary helpers
        if: steps.trigger.outputs.enabled == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/R08_REPLAN_TRIGGER scripts/r08_replan.py .github/workflows/r08-replan-apply.yml
          git add -- docs/SHADER_LAB_REFACTOR_ROADMAP.md docs/SHADER_LAB_REFACTOR_PROGRESS.md docs/R08_RESIDENT_GPU_PARAMETER_ARCHITECTURE.md
          git add -u -- .github/R08_REPLAN_TRIGGER scripts/r08_replan.py .github/workflows/r08-replan-apply.yml
          git diff --cached --check
          git commit -m "R08 pivot to resident native GPU parameters"
          git pull --rebase origin agent/upstream-refactor
          git push origin HEAD:agent/upstream-refactor
