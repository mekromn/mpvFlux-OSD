name: Refactor Dev APK

on:
  workflow_dispatch:
  push:
    branches:
      - agent/upstream-refactor
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: refactor-dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Signed phone-test APKs
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'agent/upstream-refactor' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          ref="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          safe_ref="$(printf '%s' "$ref" | tr '/ _' '---' | tr -cd '[:alnum:].-')"
          short_sha="${GITHUB_SHA::7}"
          echo "safe_ref=$safe_ref" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build standard debug APKs
        run: ./gradlew :app:assembleStandardDebug --stacktrace

      - name: Collect arm64 and universal APKs
        id: apks
        shell: bash
        run: |
          set -euo pipefail
          apk_dir="app/build/outputs/apk/standard/debug"
          mkdir -p output

          arm64="$(find "$apk_dir" -maxdepth 1 -type f -name 'app-standard-arm64-v8a-debug.apk' -print -quit)"
          universal="$(find "$apk_dir" -maxdepth 1 -type f -name 'app-standard-universal-debug.apk' -print -quit)"

          if [[ -z "$arm64" || -z "$universal" ]]; then
            echo "::error::Expected arm64-v8a and universal debug APKs were not produced."
            find app/build/outputs/apk -type f -name '*.apk' -print || true
            exit 1
          fi

          arm64_name="mpvFlux-${{ steps.meta.outputs.safe_ref }}-${{ steps.meta.outputs.short_sha }}-arm64-v8a.apk"
          universal_name="mpvFlux-${{ steps.meta.outputs.safe_ref }}-${{ steps.meta.outputs.short_sha }}-universal.apk"

          cp "$arm64" "output/$arm64_name"
          cp "$universal" "output/$universal_name"

          echo "arm64=output/$arm64_name" >> "$GITHUB_OUTPUT"
          echo "universal=output/$universal_name" >> "$GITHUB_OUTPUT"

      - name: Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)"
          if [[ -z "$apksigner" ]]; then
            echo "::error::Android apksigner was not found on the runner."
            exit 1
          fi

          "$apksigner" verify --verbose "${{ steps.apks.outputs.arm64 }}"
          "$apksigner" verify --verbose "${{ steps.apks.outputs.universal }}"

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: mpvFlux-dev-arm64-${{ steps.meta.outputs.safe_ref }}-${{ steps.meta.outputs.short_sha }}
          path: ${{ steps.apks.outputs.arm64 }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: mpvFlux-dev-universal-${{ steps.meta.outputs.safe_ref }}-${{ steps.meta.outputs.short_sha }}
          path: ${{ steps.apks.outputs.universal }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Write build summary
        shell: bash
        run: |
          {
            echo '## Refactor phone-test APKs'
            echo
            echo '- Branch: `${{ steps.meta.outputs.safe_ref }}`'
            echo '- Commit: `${{ steps.meta.outputs.short_sha }}`'
            echo '- Signing: Android debug signing generated by the build environment; no reusable signing key is stored in the repository.'
            echo '- Preferred Pixel 9 Pro XL artifact: `mpvFlux-dev-arm64-${{ steps.meta.outputs.safe_ref }}-${{ steps.meta.outputs.short_sha }}`'
            echo '- Fallback artifact: `mpvFlux-dev-universal-${{ steps.meta.outputs.safe_ref }}-${{ steps.meta.outputs.short_sha }}`'
            echo
            echo 'From a phone: open this workflow run in GitHub Actions, scroll to **Artifacts**, download the arm64 artifact, extract the ZIP, then install the APK.'
          } >> "$GITHUB_STEP_SUMMARY"
