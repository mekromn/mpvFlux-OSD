name: R08 Renderer Parity Observer

on:
  push:
    branches:
      - agent/upstream-refactor
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Report matching renderer-parity push run to PR
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Looking for R08 renderer-parity push run for head SHA: $HEAD_SHA"
          for attempt in $(seq 1 24); do
            json="$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/r08-renderer-parity-rebuild.yml/runs" \
              -f branch=agent/upstream-refactor \
              -f event=push \
              -f per_page=20)"
            run_id="$(printf '%s' "$json" | python3 -c '
import json, os, sys
obj=json.load(sys.stdin)
sha=os.environ["HEAD_SHA"]
for run in obj.get("workflow_runs", []):
    if run.get("head_sha") == sha:
        print(run.get("id", ""))
        break
')"
            if [[ -n "$run_id" ]]; then
              run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
              jobs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs")"
              summary="$(printf '%s\n%s' "$run_json" "$jobs_json" | python3 -c '
import json, sys
parts=sys.stdin.read().splitlines()
run=json.loads(parts[0])
jobs=json.loads(parts[1])
lines=[
    f"R08 renderer-parity run: {run.get(chr(105)+chr(100))}",
    f"head_sha: {run.get(chr(104)+chr(101)+chr(97)+chr(100)+chr(95)+chr(115)+chr(104)+chr(97))}",
    f"status: {run.get(chr(115)+chr(116)+chr(97)+chr(116)+chr(117)+chr(115))}",
    f"conclusion: {run.get(chr(99)+chr(111)+chr(110)+chr(99)+chr(108)+chr(117)+chr(115)+chr(105)+chr(111)+chr(110))}",
    f"url: {run.get(chr(104)+chr(116)+chr(109)+chr(108)+chr(95)+chr(117)+chr(114)+chr(108))}",
]
for job in jobs.get("jobs", []):
    lines.append(f"job {job.get(chr(105)+chr(100))}: {job.get(chr(110)+chr(97)+chr(109)+chr(101))} status={job.get(chr(115)+chr(116)+chr(97)+chr(116)+chr(117)+chr(115))} conclusion={job.get(chr(99)+chr(111)+chr(110)+chr(99)+chr(108)+chr(117)+chr(115)+chr(105)+chr(111)+chr(110))}")
print("\\n".join(lines))
')"
              printf '%b\n' "$summary"
              body="$(printf 'R08 parity observer for `%s`\n\n```text\n%b\n```' "$HEAD_SHA" "$summary")"
              gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1/comments" -f body="$body" >/dev/null
              exit 0
            fi
            echo "Parity run not indexed yet (attempt $attempt/24)."
            sleep 5
          done
          echo '::error::No matching renderer-parity push run found for this branch head.'
          exit 1
