############################################################
# PIXEL 9 PRO XL
# V3.1 RESIDENT SHADER LAB — R08 vo=gpu PARAM PATH
#
# Designed around the empirically verified brightness path:
#   vo=gpu + Vulkan + SDR-intensity + target-peak=auto
############################################################


############################
# RENDERER
############################

vo=gpu
gpu-api=vulkan
gpu-context=androidvk
hwdec=mediacodec-copy

# High-precision intermediate framebuffer
fbo-format=rgba16f


############################
# SCALING
############################

scale=ewa_lanczossharp
cscale=ewa_lanczos
dscale=ewa_lanczos

correct-downscaling=yes

# This deliberately creates mpv's LINEAR stage for upscaling,
# where the v3 shader performs its luminance/color-volume math.
sigmoid-upscaling=yes

# Keep high-quality linear-light downscaling available as well.
linear-downscaling=yes


############################
# QUALITY
############################

deband=yes
deband-iterations=2
deband-threshold=24
deband-range=16
deband-grain=8

dither=fruit
dither-depth=auto


############################
# GLOBAL IMAGE CONTROLS
############################

# V3.1 owns the perceptual luminance/color-volume shaping.
# Keep mpv's ordinary image controls neutral by default.
brightness=0
contrast=0
gamma=0
saturation=0
hue=0


############################
# SHADER LAB INPUT
############################

# R08 Android loads the controller explicitly before mpv_initialize and owns
# resident shader attachment. Keep only the input configuration here so there
# is exactly one owner for the Lua controller and one owner for the GLSL hook.
input-conf="/storage/emulated/0/mpv/config/input.conf"


############################
# SUBTITLES
############################

# Start with no embedded or external subtitle track selected.
sid=no
secondary-sid=no
sub-auto=no


############################################################
# AUTOMATIC SDR-ONLY EXPANSION
############################################################

[pixel9-sdr-expanded-v3.1]

profile-desc=Pixel 9 Pro XL V3.1 resident shader lab

# Apply to SDR transfer functions, but leave true PQ/HLG HDR alone.
profile-cond=(get("video-params/gamma","") ~= "" and get("video-params/gamma","") ~= "pq" and get("video-params/gamma","") ~= "hlg")

# Restore the previous settings when the source changes to HDR.
profile-restore=copy


# ----------------------------------------------------------
# Proven Pixel expanded-panel-brightness path
# ----------------------------------------------------------

SDR-intensity=4.16
target-peak=auto
target-colorspace-hint=no

# Preserve the known-good vo=gpu gamut behavior.
gamut-mapping-mode=perceptual

# Do not force SDR through the problematic PQ inverse-tone-map path.
inverse-tone-mapping=no


# ----------------------------------------------------------
# R08 resident v3 perceptual expansion shader
# ----------------------------------------------------------

# Android's resident transport owns glsl-shaders attachment/removal after
# classifying the source as SDR/PQ/HLG. PARAM changes use glsl-shader-opts
# without rewriting the shader file.
