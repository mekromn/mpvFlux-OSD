############################################################
# PIXEL 9 PRO XL
# V3.1 LIVE SHADER LAB — PROVEN CURRENT-MPV SAMPLER FIX
#
# Designed around the empirically verified brightness path:
#   vo=gpu + Vulkan + SDR-intensity + target-peak=auto
############################################################


############################
# RENDERER
############################

vo=gpu
gpu-api=vulkan
hwdec=mediacodec-copy

# High-precision intermediate framebuffer
fbo-format=rgba16f


############################
# SCALING
############################

scale=ewa_lanczossharp
cscale=ewa_lanczos
dscale=ewa_lanczos

correct-downscaling=yes

# This deliberately creates mpv's LINEAR stage for upscaling,
# where the v3 shader performs its luminance/color-volume math.
sigmoid-upscaling=yes

# Keep high-quality linear-light downscaling available as well.
linear-downscaling=yes


############################
# QUALITY
############################

deband=yes
deband-iterations=2
deband-threshold=24
deband-range=16
deband-grain=8

dither=fruit
dither-depth=auto


############################
# GLOBAL IMAGE CONTROLS
############################

# v3 replaces the old gamma=-1 / contrast=5 compensation
# with a continuous linear-light luminance curve in the shader.
brightness=0
contrast=0
gamma=0
saturation=0
hue=0


############################
# LIVE SHADER LAB CONTROLLER
############################

script="/storage/emulated/0/mpv/scripts/pixel9-shader-lab.lua"
input-conf="/storage/emulated/0/mpv/input.conf"


############################
# SUBTITLES
############################

sid=no


############################################################
# AUTOMATIC SDR-ONLY EXPANSION
############################################################

[pixel9-sdr-expanded-v3.1]

profile-desc=Pixel 9 Pro XL V3.1 live shader lab

# Apply to SDR transfer functions, but leave true PQ/HLG HDR alone.
profile-cond=(get("video-params/gamma","") ~= "" and get("video-params/gamma","") ~= "pq" and get("video-params/gamma","") ~= "hlg")

# Restore the previous settings when the source changes to HDR.
profile-restore=copy


# ----------------------------------------------------------
# Proven Pixel expanded-panel-brightness path
# ----------------------------------------------------------

SDR-intensity=4.16
target-peak=auto
target-colorspace-hint=no

# Do not force SDR through the problematic PQ inverse-tone-map path.
inverse-tone-mapping=no


# ----------------------------------------------------------
# v3 perceptual expansion shader
# ----------------------------------------------------------

glsl-shaders="/storage/emulated/0/mpv/shaders/pixel9-perceptual-expansion-runtime-a.glsl"
