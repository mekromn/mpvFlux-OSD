# Pixel 9 Live Shader Lab — mpvFlux v1.1.2

# Actual mpvFlux Custom double-tap keys:
MBTN_LEFT_DBL  script-message p9lab-phone-left
MBTN_MID_DBL   script-message p9lab-phone-center
MBTN_RIGHT_DBL script-message p9lab-phone-right
Ctrl+UP        script-message p9lab-prev
Ctrl+DOWN      script-message p9lab-next
Ctrl+LEFT      script-message p9lab-dec
Ctrl+RIGHT     script-message p9lab-inc
Ctrl+SPACE     script-message p9lab-step
Ctrl+g         script-message p9lab-next-group
Ctrl+a         script-message p9lab-compare
Ctrl+b         script-message p9lab-bypass
Ctrl+c         script-message p9lab-capture-a
Ctrl+r         script-message p9lab-reset-current
Ctrl+Shift+r   script-message p9lab-reset-all
Ctrl+s         script-message p9lab-save
Ctrl+l         script-message p9lab-load
Ctrl+p         script-message p9lab-show
Ctrl+Shift+p   script-message p9lab-list
Ctrl+i         script-message p9lab-status
Ctrl+7         script-message p9lab-chroma-1075

# Shader Lab persistent UI toggle fallback
Ctrl+u script-message p9lab-toggle-ui

# Shader Lab Workstation v6 shortcuts
Ctrl+o         script-message p9lab-preview-toggle
Alt+1          script-message p9lab-builtin-load 1
Alt+2          script-message p9lab-builtin-load 2
Alt+3          script-message p9lab-builtin-load 3
Alt+4          script-message p9lab-builtin-load 4
Alt+5          script-message p9lab-builtin-load 5
Alt+6          script-message p9lab-builtin-load 6
Alt+7          script-message p9lab-builtin-load 7
Alt+8          script-message p9lab-builtin-load 8
Alt+9          script-message p9lab-builtin-load 9
Alt+0          script-message p9lab-builtin-load 10

# Workstation v6.1 Studio / Android TV
# MENU is a permanent Lab toggle. DPAD bindings are installed dynamically by
# the Lua script only while the Lab UI is visible, so normal mpv arrow-key
# behavior remains untouched while Lab is hidden.
MENU           script-message p9lab-toggle-ui

